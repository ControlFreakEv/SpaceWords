<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="parent" content="index.html">
<title>Word games</title>
<link rel="stylesheet" href="hub.css">
<link rel="stylesheet" href="back.css">
</head>
<body>
<button class="backbtn" id="backBtn" aria-label="Back"><b>&#8592;</b>Back</button>
<div class="top backroom"><h1>Word games</h1></div>
<div class="games four five seven nine">
  <button class="game c2 alt" data-go="class-words.html" data-stars="classwords:best">
    <img src="emoji/1f3eb.svg" alt="">
    <span class="txt">
      <span class="t">Class Words</span>
      <span class="d">My kindergarten word list</span>
      <span class="got"></span>
    </span>
  </button>
  <button class="game c1" data-go="picture-planet.html" data-stars="wordhop:best">
    <img src="emoji/1f680.svg" alt="">
    <span class="txt">
      <span class="t">Picture Planet</span>
      <span class="d">Read, listen, and spell picture words</span>
      <span class="got"></span>
    </span>
  </button>
  <button class="game c2 alt" data-go="saucer.html" data-stars="saucer:best">
    <img src="emoji/1f6f8.svg" alt="">
    <span class="txt">
      <span class="t">Sight Word Saucer</span>
      <span class="d">Beam up the sight words you know</span>
      <span class="got"></span>
    </span>
  </button>
  <button class="game c3 alt" data-go="match.html?g=connect" data-stars="match:connect:best">
    <img src="emoji/1f517.svg" alt="">
    <span class="txt">
      <span class="t">Connect the Pairs</span>
      <span class="d">Match each word to its picture</span>
      <span class="got"></span>
    </span>
  </button>
  <button class="game c1" data-go="match.html?g=rhyme" data-stars="match:rhyme:best">
    <img src="emoji/1f3b5.svg" alt="">
    <span class="txt">
      <span class="t">Rhyming Pairs</span>
      <span class="d">Find the words that rhyme</span>
      <span class="got"></span>
    </span>
  </button>
  <button class="game c2 alt" data-go="sound-lab.html" data-stars="sound:best">
    <img src="emoji/1f9ea.svg" alt="">
    <span class="txt">
      <span class="t">Sound Lab</span>
      <span class="d">Vowel sounds, magic e, syllables</span>
      <span class="got"></span>
    </span>
  </button>
  <button class="game c3" data-go="compound.html" data-stars="compound:best">
    <img src="emoji/1f9e9.svg" alt="">
    <span class="txt">
      <span class="t">Compound Words</span>
      <span class="d">sun + flower = sunflower</span>
      <span class="got"></span>
    </span>
  </button>
  <button class="game c1" data-go="wordsearch.html" data-stars="search:best">
    <img src="emoji/1f50d.svg" alt="">
    <span class="txt">
      <span class="t">Word Search</span>
      <span class="d">Find the hidden words</span>
      <span class="got"></span>
    </span>
  </button>
  <button class="game c3 alt" data-go="read.html" data-stars="read:best">
    <img src="emoji/1f4da.svg" alt="">
    <span class="txt">
      <span class="t">Read and Answer</span>
      <span class="d">Read a story, answer a question</span>
      <span class="got"></span>
    </span>
  </button>
</div>
<script src="speech.js"></script>
<script src="hub.js"></script>
</body>
</html>

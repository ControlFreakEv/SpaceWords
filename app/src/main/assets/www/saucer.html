<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="parent" content="words.html">
<title>Sight Word Saucer</title>
<style>
@font-face{font-family:"WHRead";src:url("fonts/andika.ttf") format("truetype");font-weight:400}
@font-face{font-family:"WHRead";src:url("fonts/andika-bold.ttf") format("truetype");font-weight:700}
@font-face{font-family:"WHFun";src:url("fonts/fredoka.ttf") format("truetype");font-weight:600}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#0B1026;background-image:radial-gradient(circle at 70% 20%, #2A1E5C 0%, #131A3D 45%, #0B1026 80%);
  color:#F3F6FF;font-family:"WHFun","Trebuchet MS",sans-serif;font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);overflow:hidden;
}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;outline:none}
img{display:block}

#sky{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;-webkit-animation:twinkle 3s ease-in-out infinite;animation:twinkle 3s ease-in-out infinite}
@-webkit-keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

.screen{display:none;position:absolute;left:0;top:0;right:0;bottom:0;padding:3vmin 4vmin;overflow:hidden;z-index:1}
.screen.on{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}

/* panels: dark glass with a hard cut-out shadow */
.panel{background:#1B2457;border:0.5vmin solid #5CE1E6;border-radius:2.8vmin;box-shadow:0.8vmin 0.8vmin 0 #05081A}
.card{background:#F7F9FF;color:#14193A;border:0.5vmin solid #05081A;border-radius:2.8vmin;box-shadow:0.8vmin 0.8vmin 0 #05081A}
.press{-webkit-transition:-webkit-transform .08s,box-shadow .08s;transition:transform .08s,box-shadow .08s}
.press:active{-webkit-transform:translate(0.5vmin,0.5vmin);transform:translate(0.5vmin,0.5vmin);box-shadow:0.3vmin 0.3vmin 0 #05081A}

.hover{-webkit-animation:hover 3.2s ease-in-out infinite;animation:hover 3.2s ease-in-out infinite}
@-webkit-keyframes hover{0%,100%{-webkit-transform:translateY(0) rotate(-3deg)}50%{-webkit-transform:translateY(-1.6vmin) rotate(3deg)}}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-1.6vmin) rotate(3deg)}}

/* home */
.hero{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin:1vmin 0 3.5vmin}
.hero img{width:12vmin;height:12vmin;-webkit-flex:none;flex:none;margin-right:3vmin}
.hero h1{margin:0;font-size:9vmin;line-height:1;font-weight:600;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.hero p{margin:1.2vmin 0 0;font-size:3.4vmin;color:#B9C3F2}
.path{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -1.2vmin}
.stop{width:calc(20% - 2.4vmin);margin:1.2vmin;padding:2.2vmin 2.4vmin;text-align:left;min-height:30vmin;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.planet{position:relative;width:9vmin;height:9vmin;border-radius:50%;margin:0.6vmin 0 0.4vmin 0.6vmin}
.p0{background:radial-gradient(circle at 35% 35%, #F4F4F8 0%, #C7CBDA 45%, #8E93A8 100%)}
.p1{background:radial-gradient(circle at 35% 35%, #FFC29E 0%, #E8673F 50%, #A8362A 100%)}
.p2{background:linear-gradient(#EED3AE 0%, #EED3AE 18%, #C98B5A 18%, #C98B5A 32%, #F3E1C4 32%, #F3E1C4 48%, #B97446 48%, #B97446 60%, #EED3AE 60%, #EED3AE 78%, #D19A6B 78%, #D19A6B 100%)}
.p3{background:radial-gradient(circle at 35% 35%, #FFF1B8 0%, #F2C35B 55%, #C48A2C 100%)}
.p3:after{content:"";position:absolute;left:-30%;top:36%;width:160%;height:28%;border:0.6vmin solid #F7DE9A;border-radius:50%;-webkit-transform:rotate(-18deg);transform:rotate(-18deg)}
.p4{background:radial-gradient(circle at 35% 35%, #B8F1FF 0%, #4E8EF0 55%, #2A4FB5 100%)}
.pname{font-size:3.4vmin;margin-top:1.6vmin}
.grade{font-size:2.5vmin;color:#5CE1E6}
.ex{font-family:"WHRead",sans-serif;font-weight:400;font-size:2.8vmin;color:#B9C3F2;margin-top:.8vmin}
.best{margin-top:auto;padding-top:1vmin;font-size:2.5vmin;color:#B9C3F2}
.best b{color:#FFD93D}
.foot{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;margin-top:auto;padding-top:2vmin}
.foot > *{margin:0 2vmin 1.4vmin 0}
.pill{padding:1.6vmin 2.8vmin;font-size:2.8vmin;border-radius:10vmin}
.note{font-size:2.4vmin;color:#B9C3F2}
.credit{font-size:1.8vmin;color:#7F8AC0;width:100%}

/* game */
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:1vmin}
.icon-btn{width:9vmin;height:9vmin;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-flex:none;flex:none}
.icon-btn img{width:5.5vmin;height:5.5vmin}
.dots{-webkit-flex:1;flex:1;text-align:center;font-size:0}
.dot{display:inline-block;width:3.2vmin;height:3.2vmin;border-radius:50%;border:0.45vmin solid #5CE1E6;background:#131A3D;margin:0 .6vmin}
.dot.now{background:#5CE1E6}.dot.gold{background:#FFD93D;border-color:#FFD93D}.dot.ok{background:#7CFFB2;border-color:#7CFFB2}
.stars{font-size:4vmin;min-width:13vmin;text-align:right;color:#FFD93D}
.stage{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-around;justify-content:space-around}
.ufo{width:17vmin;height:17vmin}
.hint{margin:0;font-size:3.2vmin;color:#B9C3F2;text-align:center}
.prompt{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
.sentence{font-family:"WHRead",sans-serif;font-weight:700;font-size:6.6vmin;line-height:1.3;padding:2vmin 4vmin;text-align:center;max-width:92vw}
.blank{display:inline-block;min-width:16vmin;border-bottom:0.7vmin dashed #5CE1E6;color:#2A4FB5;margin:0 .6vmin}
.flash{font-family:"WHRead",sans-serif;font-weight:700;font-size:13vmin;line-height:1.1;padding:1vmin 6vmin 2vmin;min-width:30vmin;text-align:center}
.flash.hidden{color:#B9C3F2}
.speak{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:1.6vmin 3.4vmin;font-size:3.4vmin;border-radius:10vmin;background:#FFD93D;color:#14193A;margin:1.4vmin .8vmin 0}
.speak img{width:4.4vmin;height:4.4vmin;margin-right:1.4vmin}
.speak.big{padding:3vmin 6vmin;font-size:5vmin}
.speak.big img{width:7vmin;height:7vmin}
.speak.ghost{background:#1B2457;color:#F3F6FF;border:0.5vmin solid #5CE1E6}
.btnrow{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center}
.choices{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;width:100%}
.choice{width:26vmin;height:16vmin;margin:0 1.6vmin;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:1vmin;font-family:"WHRead",sans-serif;font-weight:700;font-size:7vmin;position:relative;z-index:2}
.choice.dim{opacity:.3;pointer-events:none}
.choice.right{background:#7CFFB2}
.fly{-webkit-transition:-webkit-transform .8s ease-in,opacity .8s ease-in;transition:transform .8s ease-in,opacity .8s ease-in}
.nope{-webkit-animation:shake .4s;animation:shake .4s}
@-webkit-keyframes shake{20%{-webkit-transform:translateX(-1.4vmin)}40%{-webkit-transform:translateX(1.4vmin)}60%{-webkit-transform:translateX(-.8vmin)}80%{-webkit-transform:translateX(.8vmin)}}
@keyframes shake{20%{transform:translateX(-1.4vmin)}40%{transform:translateX(1.4vmin)}60%{transform:translateX(-.8vmin)}80%{transform:translateX(.8vmin)}}
.row{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.slot{width:8vmin;height:10vmin;margin:0 .7vmin;border-bottom:0.8vmin solid #5CE1E6;font-family:"WHRead",sans-serif;font-weight:700;font-size:8vmin;line-height:10vmin;text-align:center;color:#F3F6FF}
.slot.filled{-webkit-animation:pop .25s;animation:pop .25s}
@-webkit-keyframes pop{50%{-webkit-transform:scale(1.2)}}
@keyframes pop{50%{transform:scale(1.2)}}
.tile{width:10vmin;height:10vmin;margin:.8vmin;font-family:"WHRead",sans-serif;font-weight:700;font-size:6.6vmin;line-height:9vmin;text-align:center;border-radius:2.2vmin}
.tile.used{visibility:hidden}

.beam{position:fixed;z-index:1;pointer-events:none;opacity:0;-webkit-transition:opacity .25s;transition:opacity .25s}
.beam.on{opacity:1}
.beam svg{width:100%;height:100%;display:block}

/* end */
.endbox{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}
.endbox img{width:22vmin;height:22vmin}
.endbox h2{margin:2vmin 0 1vmin;font-size:10vmin;font-weight:600;line-height:1;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.score{font-size:4.4vmin;color:#B9C3F2}
.score b{color:#FFD93D}
.endbtns{margin-top:4vmin;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.bigbtn{padding:2.4vmin 4vmin;font-size:3.8vmin;border-radius:2.6vmin;margin:1vmin 1.4vmin}
.bigbtn.go{background:#7CFFB2;color:#14193A;border-color:#05081A}

.bit{position:fixed;width:1.8vmin;height:1.8vmin;border-radius:50%;pointer-events:none;z-index:9;
  -webkit-transition:-webkit-transform .9s ease-out,opacity .9s ease-out;transition:transform .9s ease-out,opacity .9s ease-out}

@media (orientation: portrait){
  .stop{width:calc(50% - 2.4vmin);min-height:22vmin}
  .choices{-webkit-flex-wrap:wrap;flex-wrap:wrap;max-width:70vmin}
  .choice{margin:1.6vmin;width:30vmin}
  .hero h1{font-size:10vmin}
}
.speakrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.speakrow .speak{margin-top:0}
.btnrow .speakrow{margin-right:1.6vmin}
.hintrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.sayb{width:8vmin;height:8vmin;border-radius:50%;background:#FFD93D;border:0.5vmin solid #1F2A44;margin-left:2vmin;-webkit-flex:none;flex:none;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.sayb img{width:5vmin;height:5vmin}
</style>

  <div class="stage" id="stage"></div>
</section>

<section class="screen" id="end">

    <h2 id="endTitle"></h2>
    <div class="score" id="endScore"></div>

</section>

function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function show(id){ ["home","game","end"].forEach(function(s){ $(s).className = "screen" + (s === id ? " on" : ""); }); document.body.setAttribute("data-screen", id); Ways.close(); }
function hasClass(e, c){ return (" " + e.className + " ").indexOf(" " + c + " ") >= 0; }
function addClass(e, c){ if (!hasClass(e, c)) e.className += " " + c; }
function removeClass(e, c){ e.className = (" " + e.className + " ").replace(" " + c + " ", " ").replace(/^\s+|\s+$/g, ""); }
function load(k, d){ try { var v = localStorage.getItem("saucer:" + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem("saucer:" + k, JSON.stringify(v)); } catch(e){} }
function say(keys){ Speech.say(keys); }
function canTalk(){ return Speech.canTalk(); }
var best = load("best", {});

/* star field */
(function(){
  var sky = $("sky");
  for (var i = 0; i < 70; i++){
    var s = el("span", "star"), size = Math.random() < 0.15 ? 0.6 : 0.3;
    s.style.left = (Math.random()*100) + "%";
    s.style.top = (Math.random()*100) + "%";

    s.style.webkitAnimationDelay = s.style.animationDelay = (Math.random()*3) + "s";
    sky.appendChild(s);
  }
})();

/* how alike two words look: was/saw, then/them, from/form... */
function alike(a, b){
  var s = 0;
  if (a.charAt(0) === b.charAt(0)) s += 2;
  if (a.charAt(a.length-1) === b.charAt(b.length-1)) s += 1;
  s -= Math.abs(a.length - b.length);
  var pool = b.split("");
  a.split("").forEach(function(ch){ var i = pool.indexOf(ch); if (i >= 0){ s += 1; pool.splice(i, 1); } });
  if (a.split("").reverse().join("") === b) s += 4;
  return s;
}
function lookAlikes(word, n){
  var others = LEVELS[G.level].words.filter(function(x){ return !Speech.soundsSame(x.w, word.w); });   // never "too" for "to"
  others.sort(function(x, y){ return alike(word.w, y.w) - alike(word.w, x.w); });
  return shuffle(others.slice(0, Math.max(n + 3, 6))).slice(0, n);
}

/* home */
function renderHome(){
  var path = $("path"); path.innerHTML = "";
  LEVELS.forEach(function(lv, i){
    var b = el("button", "panel press stop");
    var got = best[i];
    b.innerHTML = '<span class="planet p' + i + '"></span>' +
      '<span class="pname">' + lv.planet + '</span>' +
      '<span class="grade">' + lv.grade + '</span>' +
      '<span class="ex">' + lv.words.slice(0,3).map(function(x){ return x.w; }).join(", ") + '</span>' +
      '<span class="best">' + (got === undefined ? "Not visited yet" : 'Best: <b>&#9733; ' + got + '</b> of ' + ROUNDS) + '</span>';
    b.onclick = function(){ startLevel(i); };
    path.appendChild(b);
  });
  $("speechNote").style.display = Speech.mode() === "none" ? "" : "none";
}
Speech.onChange(function(){ if (hasClass($("home"), "on")) renderHome(); });

/* game */
var G = null;
function modesFor(word){
  var m = [];
  if (canTalk()) m.push("listen");
  if (word.s) m.push("sentence");
  if (word.w.length >= 2) m.push("spell");
  return m;
}
function startLevel(i){
  var pool = shuffle(LEVELS[i].words).filter(function(w){ return modesFor(w).length > 0; });
  var words = pool.slice(0, ROUNDS);
  /* every word has a sentence now, so the three kinds of round simply take turns (beam up, sentence, spell) */
  var order = ["listen","sentence","spell"], k = Math.floor(Math.random()*3);
  var modes = words.map(function(w){
    var ok = modesFor(w);
    for (var t = 0; t < 3; t++){ var m = order[(k + t) % 3]; if (ok.indexOf(m) >= 0){ k = (k + t + 1) % 3; return m; } }
    return ok[0];
  });
  G = { level:i, words:words, modes:modes, round:0, stars:0, results:[] };
  show("game");
  renderRound();
}
/* Back: from a game or the end screen to the level list; from the level list to the picker */
function goBack(){ Speech.stop(); if (hasClass($("home"), "on")) location.href = "words.html"; else { renderHome(); show("home"); } }
$("backBtn").onclick = goBack;
window.goBack = goBack;

function renderDots(){
  var d = $("dots"); d.innerHTML = "";
  for (var i = 0; i < G.words.length; i++){
    var r = G.results[i];
    d.appendChild(el("span", "dot" + (r === "gold" ? " gold" : r === "ok" ? " ok" : i === G.round ? " now" : "")));
  }
  $("stars").innerHTML = "&#9733; " + G.stars;
}

function renderRound(){
  G.mistakes = 0; G.locked = false;
  renderDots();
  var word = G.words[G.round], mode = G.modes[G.round];
  var stage = $("stage"); stage.innerHTML = "";
  var ufo = el("img", "ufo hover"); ufo.src = "emoji/1f6f8.svg"; ufo.alt = ""; ufo.id = "ufo";
  stage.appendChild(ufo);
  /* the instruction, with a speaker button to hear it again */
  var hr = el("div", "hintrow");
  hr.appendChild(el("p", "hint", Speech.tapText(HINTS[mode])));
  if (canTalk()){
    var sb = el("button", "press sayb", '<img src="emoji/1f50a.svg" alt="">');
    sb.setAttribute("aria-label", "Hear the instructions");
    sb.onclick = function(){ say(mode === "sentence" ? ["i_sentence"] : [mode === "listen" ? "i_beam" : "i_look", word.k]); };
    hr.appendChild(sb);
  }
  stage.appendChild(hr);
  if (mode === "listen") roundListen(stage, word);
  else if (mode === "sentence") roundSentence(stage, word);
  else roundSpell(stage, word);
}

function speakBtn(word, big){
  var b = el("button", "press speak" + (big ? " big" : ""), '<img src="emoji/1f50a.svg" alt="">Hear it');
  b.onclick = function(){ say([word.k]); };
  /* the turtle beside it: say words slowly (on/off) */
  var row = el("div", "speakrow");
  row.appendChild(b);
  if (Speech.canTalk()) row.appendChild(Speech.turtleButton(word.k));
  return row;
}
function choiceRow(stage, word, options){
  var row = el("div", "choices");
  shuffle(options).forEach(function(opt){
    var b = el("button", "card press choice");
    b.textContent = opt.w;
    b.onclick = function(){ if (opt.w === word.w) correct(b, word); else wrong(b, true); };
    row.appendChild(b);
  });
  stage.appendChild(row);
}

function roundListen(stage, word){
  var p = el("div", "prompt");
  p.appendChild(speakBtn(word, true));
  stage.appendChild(p);
  choiceRow(stage, word, [word].concat(lookAlikes(word, 3)));
  setTimeout(function(){ if (G.words[G.round] === word) say(["i_beam", word.k]); }, 400);
}

function roundSentence(stage, word){
  var p = el("div", "prompt");
  var parts = word.s.split("___");
  /* every word of the sentence reads itself when tapped */
  var sent = el("div", "card sentence", Speech.tapText(parts[0]) + '<span class="blank">&nbsp;</span>' + Speech.tapText(parts[1]));
  var blank = sent.querySelector(".blank");
  p.appendChild(sent);
  stage.appendChild(p);
  G.blank = blank;
  setTimeout(function(){ if (G.words[G.round] === word) say(["i_sentence"]); }, 400);
  var lv = LEVELS[G.level].words, opts = [word];
  word.d.forEach(function(dw){ for (var i = 0; i < lv.length; i++) if (lv[i].w === dw) opts.push(lv[i]); });
  choiceRow(stage, word, opts);
}

function roundSpell(stage, word){
  var p = el("div", "prompt");
  var flash = el("div", "card flash");
  flash.textContent = word.w;
  p.appendChild(flash);
  var btns = el("div", "btnrow");
  if (canTalk()) btns.appendChild(speakBtn(word, false));
  var peek = el("button", "press speak ghost", "Peek");
  peek.style.display = "none";
  peek.onclick = function(){
    if (G.locked) return;
    G.mistakes++;
    flash.textContent = word.w; removeClass(flash, "hidden");
    setTimeout(function(){ if (!G.locked){ flash.textContent = "?"; addClass(flash, "hidden"); } }, 1500);
  };
  btns.appendChild(peek);
  p.appendChild(btns);
  stage.appendChild(p);
  /* hide the word once the voice has finished saying it (a fixed timer cut the word off), after
     at least 3 seconds of looking; the long timer is only a safety net */
  var shownAt = Date.now(), covered = false;
  Speech.say(["i_look", word.k], function(){ setTimeout(cover, Math.max(1200, 3400 - (Date.now() - shownAt))); });

  var letters = word.w.split("");
  var slots = el("div", "row");
  var slotEls = letters.map(function(){ var s = el("div", "slot"); slots.appendChild(s); return s; });
  stage.appendChild(slots);

  var pool = letters.slice();
  var abc = "abcdefghiklmnoprstuwy".split("").filter(function(c){ return letters.indexOf(c) < 0; });
  pool.push(pick(abc));
  if (letters.length <= 4) pool.push(pick(abc));
  var order = shuffle(pool);
  var tiles = el("div", "row");
  tiles.style.visibility = "hidden";
  var pos = 0;
  order.forEach(function(ch){
    var t = el("button", "card press tile");
    t.textContent = ch;
    t.onclick = function(){
      if (G.locked || hasClass(t, "used")) return;
      if (ch === letters[pos]){
        slotEls[pos].textContent = ch;
        addClass(slotEls[pos], "filled");
        addClass(t, "used");
        pos++;
        if (pos === letters.length){ flash.textContent = word.w; removeClass(flash, "hidden"); correct(flash, word); }
      } else wrong(t, false);
    };
    tiles.appendChild(t);
  });
  stage.appendChild(tiles);

  /* look, then cover and spell */
  function cover(){
    if (covered || G.locked || G.words[G.round] !== word) return;
    covered = true;
    flash.textContent = "?"; addClass(flash, "hidden");
    tiles.style.visibility = "";
    peek.style.display = "";
    say(["p_spell"]);
  }
  setTimeout(cover, 12000);
}

function beamUp(target, done){
  var ufo = $("ufo"), beam = $("beam");
  if (!ufo){ done(); return; }
  var u = ufo.getBoundingClientRect(), t = target.getBoundingClientRect();
  var top = u.top + u.height*0.62, cx = u.left + u.width/2;
  var bottom = t.top + t.height/2, w = Math.max(t.width*1.4, u.width*1.2);
  beam.style.left = (cx - w/2) + "px";
  beam.style.top = top + "px";
  beam.style.width = w + "px";
  beam.style.height = Math.max(bottom - top, 10) + "px";
  addClass(beam, "on");
  setTimeout(function(){
    var dx = cx - (t.left + t.width/2), dy = top - (t.top + t.height/2);
    addClass(target, "fly");
    var tr = "translate(" + dx + "px," + dy + "px) scale(0.15)";
    target.style.webkitTransform = tr; target.style.transform = tr; target.style.opacity = "0";
  }, 300);
  setTimeout(function(){ removeClass(beam, "on"); done(); }, 1200);
}

function correct(target, word){
  if (G.locked) return;
  G.locked = true;
  var clean = G.mistakes === 0;
  if (clean) G.stars++;
  G.results[G.round] = clean ? "gold" : "ok";
  renderDots();
  var mode = G.modes[G.round];
  if (mode === "sentence"){
    G.blank.textContent = word.w;
    say([word.sk || word.k, "p_space_" + Math.floor(Math.random()*PRAISE_COUNT)]);
  } else {
    say([word.k, "p_space_" + Math.floor(Math.random()*PRAISE_COUNT)]);
  }
  if (hasClass(target, "choice")) addClass(target, "right");
  sparkle(target);
  setTimeout(function(){ beamUp(target, function(){}); }, mode === "sentence" ? 700 : 250);
  setTimeout(nextRound, mode === "sentence" ? 3200 : 2200);
}

function wrong(target, dim){
  if (G.locked) return;
  G.mistakes++;
  removeClass(target, "nope"); void target.offsetWidth; addClass(target, "nope");
  if (dim){ setTimeout(function(){ addClass(target, "dim"); }, 400); say(["p_try"]); }
}

function nextRound(){
  G.round++;
  if (G.round >= G.words.length) showEnd(); else Ways.between(renderRound);
}

function showEnd(){
  var i = G.level, s = G.stars, n = G.words.length;
  if (best[i] === undefined || s > best[i]){ best[i] = s; save("best", best); }
  $("endTitle").textContent = s === n ? "Perfect mission!" : "Mission complete!";
  $("endScore").innerHTML = "You collected <b>&#9733; " + s + "</b> of " + n + " stars.";
  var btns = $("endBtns"); btns.innerHTML = "";
  var again = el("button", "panel press bigbtn", "Fly again"); again.onclick = function(){ startLevel(i); }; btns.appendChild(again);
  if (i < LEVELS.length - 1){
    var nx = el("button", "card press bigbtn go", "Next: " + LEVELS[i+1].planet); nx.onclick = function(){ startLevel(i+1); }; btns.appendChild(nx);
  }
  var all = el("button", "panel press bigbtn", "All planets"); all.onclick = function(){ renderHome(); show("home"); }; btns.appendChild(all);
  show("end");
  say(s === n ? ["p_mission","p_perfect"] : ["p_mission","p_stars_" + s]);
}

function sparkle(target){
  var r = target.getBoundingClientRect();
  for (var i = 0; i < 16; i++){
    (function(i){
      var b = el("span", "bit");
      b.style.left = (r.left + r.width/2) + "px";
      b.style.top = (r.top + r.height/2) + "px";
      b.style.background = COLORS[i % COLORS.length];
      document.body.appendChild(b);
      var x = Math.random()*360 - 180, y = Math.random()*240 - 160;
      setTimeout(function(){
        var t = "translate(" + x + "px," + y + "px) scale(0.4)";
        b.style.webkitTransform = t; b.style.transform = t; b.style.opacity = "0";
      }, 20);
      setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 1000);
    })(i);
  }
}

document.addEventListener("touchstart", function(){}, true);
renderHome();
window.Saucer = { levels:LEVELS, start:startLevel, state:function(){ return G; }, lookAlikes:lookAlikes };   // tests
})();
</script>

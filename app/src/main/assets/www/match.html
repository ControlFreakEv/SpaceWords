<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="parent" content="words.html">
<title>Match games</title>
<style>
@font-face{font-family:"WHRead";src:url("fonts/andika.ttf") format("truetype");font-weight:400}
@font-face{font-family:"WHRead";src:url("fonts/andika-bold.ttf") format("truetype");font-weight:700}
@font-face{font-family:"WHFun";src:url("fonts/fredoka.ttf") format("truetype");font-weight:600}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#0B1026;background-image:radial-gradient(circle at 30% 15%, #2A1E5C 0%, #131A3D 45%, #0B1026 80%);color:#F3F6FF;font-family:"WHFun","Trebuchet MS",sans-serif;font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);overflow:hidden;
}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;outline:none}
img{display:block}
.screen{display:none;position:absolute;left:0;top:0;right:0;bottom:0;padding:3vmin 4vmin;overflow:hidden;z-index:1}
.screen.on{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.paper{background:#F7F9FF;color:#1F2A44;border:0.5vmin solid #1F2A44;border-radius:2.8vmin;box-shadow:0.8vmin 0.8vmin 0 #05081A}
.press{-webkit-transition:-webkit-transform .08s,box-shadow .08s,background .15s;transition:transform .08s,box-shadow .08s,background .15s}
.press:active{-webkit-transform:translate(0.5vmin,0.5vmin);transform:translate(0.5vmin,0.5vmin);box-shadow:0.3vmin 0.3vmin 0 #05081A}
.flex{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}

/* level list */
.hero{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin:2vmin 0 4vmin}
.hero img{width:12vmin;height:12vmin;-webkit-flex:none;flex:none;margin-right:3vmin}
.hero h1{margin:0;font-size:9vmin;line-height:1;font-weight:600;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.hero p{margin:1vmin 0 0;font-size:3.6vmin;color:#B9C3F2}
.path{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -1.2vmin}
.stone{width:18%;margin:1.2vmin 1%;padding:2.2vmin 2.4vmin;text-align:left;min-height:26vmin;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.num{width:7vmin;height:7vmin;border-radius:50%;border:0.5vmin solid #1F2A44;font-size:3.6vmin;line-height:6vmin;text-align:center;color:#1F2A44}
.sname{font-size:3.4vmin;margin-top:1.4vmin}
.ex{font-family:"WHRead",sans-serif;font-weight:400;font-size:3vmin;color:#4F5F80;margin-top:.6vmin}
.best{margin-top:auto;padding-top:1vmin;font-size:2.6vmin;color:#4F5F80}
.best b{color:#1F2A44}
.foot{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;margin-top:auto;padding-top:2vmin}
.foot > *{margin:0 2vmin 1.4vmin 0}
.pill{padding:1.6vmin 2.8vmin;font-size:2.8vmin;border-radius:10vmin}
.credit{font-size:1.8vmin;color:#7F8AC0;width:100%}

/* game */
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:1vmin}
.icon-btn{width:9vmin;height:9vmin;-webkit-flex:none;flex:none}
.icon-btn img{width:5.5vmin;height:5.5vmin}
.dots{-webkit-flex:1;flex:1;text-align:center;font-size:0}
.dot{display:inline-block;width:3.6vmin;height:3.6vmin;border-radius:50%;border:0.45vmin solid #5CE1E6;background:#131A3D;margin:0 .8vmin}
.dot.now{background:#5CE1E6}.dot.gold{background:#FFD93D;border-color:#FFD93D}.dot.ok{background:#7CFFB2;border-color:#7CFFB2}
.stars{font-size:4vmin;min-width:13vmin;text-align:right;color:#FFD93D}
.stage{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
.hintrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:1vmin}
.hint{margin:0;font-size:4vmin;color:#B9C3F2;text-align:center}
.sayb{width:8vmin;height:8vmin;border-radius:50%;background:#FFD93D;margin-left:2vmin;-webkit-flex:none;flex:none}
.sayb img{width:5vmin;height:5vmin}

.board{position:relative;-webkit-flex:1;flex:1;width:100%;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;padding:0 8vmin}
.col{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-around;justify-content:space-around;width:42vmin;position:relative;z-index:2}
.item{height:12vmin;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  font-family:"WHRead",sans-serif;font-weight:700;font-size:6.4vmin;line-height:1}
.item img{width:10vmin;height:10vmin}
.item.sel{background:#FFD93D;-webkit-transform:scale(1.06);transform:scale(1.06)}
.item.done{background:#7CFFB2;color:#14193A;pointer-events:none}
.lines{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none}
.nope{-webkit-animation:shake .4s;animation:shake .4s}
@-webkit-keyframes shake{20%{-webkit-transform:translateX(-1.4vmin)}40%{-webkit-transform:translateX(1.4vmin)}60%{-webkit-transform:translateX(-.8vmin)}80%{-webkit-transform:translateX(.8vmin)}}
@keyframes shake{20%{transform:translateX(-1.4vmin)}40%{transform:translateX(1.4vmin)}60%{transform:translateX(-.8vmin)}80%{transform:translateX(.8vmin)}}

/* end */
.endbox{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}
.endbox img{width:18vmin;height:18vmin}
.endbox h2{margin:2vmin 0 1vmin;font-size:10vmin;font-weight:600;line-height:1;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.score{font-size:4.4vmin;color:#B9C3F2}
.score b{color:#FFD93D}
.endbtns{margin-top:4vmin;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.bigbtn{padding:2.4vmin 4vmin;font-size:3.8vmin;border-radius:2.6vmin;margin:1vmin 1.4vmin}
.bigbtn.go{background:#7CFFB2;color:#14193A}

.bit{position:fixed;width:1.8vmin;height:1.8vmin;border-radius:.4vmin;pointer-events:none;z-index:9;
  -webkit-transition:-webkit-transform .9s ease-out,opacity .9s ease-out;transition:transform .9s ease-out,opacity .9s ease-out}
#sky{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;-webkit-animation:twinkle 3s ease-in-out infinite;animation:twinkle 3s ease-in-out infinite}
@-webkit-keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@media (orientation: portrait){
  .stone{width:48%}
  .board{padding:0 2vmin}
  .col{width:38vmin}
}
</style>

<div id="sky"></div>
<button class="backbtn" id="backBtn" aria-label="Back"><b>&#8592;</b>Back</button>

<section class="screen on" id="home">
  <div class="hero backroom">
    <img id="heroImg" src="emoji/1f517.svg" alt="">
    <div><h1 id="heroTitle"></h1><p id="heroSub"></p></div>
  </div>
  <div class="path" id="path"></div>
  <div class="foot">

  </div>
</section>

<section class="screen" id="game">
  <div class="bar">
    <span class="barspace"></span>
    <div class="dots" id="dots"></div>
    <div class="stars" id="stars"></div>
  </div>
  <div class="stage" id="stage"></div>
</section>

<section class="screen" id="end">
  <div class="endbox">
    <img src="emoji/1f47d.svg" alt="">
    <h2 id="endTitle"></h2>
    <div class="score" id="endScore"></div>
    <div class="endbtns" id="endBtns"></div>
  </div>
</section>

};
var COLORS = ["#FFC93C","#FF8A3D","#E5487A","#3FB37F","#4BA3D9"];
var BOARDS = 5;

var gameId = (location.search.match(/[?&]g=([a-z]+)/) || [])[1];
if (!GAMES[gameId]) gameId = "connect";
var GAME = GAMES[gameId], RHYME = gameId === "rhyme";
document.title = GAME.title;

function load(k, d){ try { var v = localStorage.getItem("match:" + gameId + ":" + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem("match:" + gameId + ":" + k, JSON.stringify(v)); } catch(e){} }
var best = load("best", {});

/* a board: `size` pairs, no two with the same sound (so only one partner fits) */
function makeBoard(level){
  var size = GAME.sizes[level], seen = {}, words = {}, out = [];
  var pool = shuffle(GAME.pool[level]);
  for (var i = 0; i < pool.length && out.length < size; i++){
    var p = pool[i];
    if (seen[p.tag] || words[p.a] || words[p.b]) continue;
    seen[p.tag] = words[p.a] = words[p.b] = true;
    out.push(p);
  }
  return out;
}

/* ---------- level list ---------- */
function renderHome(){
  $("heroImg").src = "emoji/" + GAME.icon + ".svg";
  $("heroTitle").textContent = GAME.title;
  $("heroSub").textContent = GAME.sub;
  var path = $("path"); path.innerHTML = "";
  GAME.names.forEach(function(name, i){
    var b = el("button", "paper press stone"), got = best[i], ex = GAME.pool[i].slice(0, 2);
    b.innerHTML = '<span class="num" style="background:' + COLORS[i] + '">' + (i + 1) + '</span>' +
      '<span class="sname">' + name + '</span>' +
      '<span class="ex">' + ex.map(function(p){ return RHYME ? p.a + " + " + p.b : p.a; }).join(", ") + '</span>' +
      '<span class="best">' + (got === undefined ? "Not played yet" : 'Best: <b>&#9733; ' + got + '</b> of ' + BOARDS) + '</span>';
    b.onclick = function(){ startLevel(i); };
    path.appendChild(b);
  });
}
Speech.onChange(function(){ if (hasClass($("home"), "on")) renderHome(); });
/* Back: from a game or the end screen to the level list; from the level list to the picker */
function goBack(){ Speech.stop(); if (hasClass($("home"), "on")) location.href = "words.html"; else { renderHome(); show("home"); } }
$("backBtn").onclick = goBack;
window.goBack = goBack;

/* ---------- playing ---------- */
var G = null;
function startLevel(i){
  G = { level:i, board:0, stars:0, results:[] };
  show("game");
  renderBoard();
}
function renderDots(){
  var d = $("dots"); d.innerHTML = "";
  for (var i = 0; i < BOARDS; i++){
    var r = G.results[i];
    d.appendChild(el("span", "dot" + (r === "gold" ? " gold" : r === "ok" ? " ok" : i === G.board ? " now" : "")));
  }
  $("stars").innerHTML = "&#9733; " + G.stars;
}

function renderBoard(){
  var pairs = makeBoard(G.level);
  G.pairs = pairs; G.matched = 0; G.mistakes = 0; G.sel = null; G.locked = false;
  renderDots();
  var stage = $("stage"); stage.innerHTML = "";
  var hr = el("div", "hintrow");
  hr.appendChild(el("p", "hint", Speech.tapText(GAME.hint)));
  if (Speech.canTalk()){
    var sb = el("button", "paper press sayb flex", '<img src="emoji/1f50a.svg" alt="">');
    sb.onclick = function(){ say([GAME.instr]); };
    hr.appendChild(sb);
  }
  stage.appendChild(hr);

  var board = el("div", "board");
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "lines");
  board.appendChild(svg);
  G.boardEl = board; G.svg = svg; G.links = [];
  var left = el("div", "col"), right = el("div", "col");
  shuffle(pairs).forEach(function(p){ left.appendChild(item(p, "L")); });
  shuffle(pairs).forEach(function(p){ right.appendChild(item(p, "R")); });
  board.appendChild(left); board.appendChild(right);
  stage.appendChild(board);
  var thisBoard = G.board;
  setTimeout(function(){ if (G && G.board === thisBoard && !G.done) say([GAME.instr]); }, 400);
}

function item(p, side){
  var showPicture = !RHYME && side === "R";
  var b = el("button", "paper press item", showPicture ? '<img src="emoji/' + p.b + '.svg" alt="">' : (side === "L" ? p.a : p.b));
  b.pair = p; b.side = side;
  b.onclick = function(){ tap(b); };
  return b;
}

function tap(b){
  if (G.locked || hasClass(b, "done")) return;
  /* Rhyming Pairs says the tapped word; when it completes a pair the praise follows it in the same
     breath (a separate say for the pair cut the second word off and repeated the first one) */
  var w = RHYME ? [key(b.side === "L" ? b.pair.a : b.pair.b)] : [];
  var s = G.sel;
  if (!s || s.side === b.side){
    say(w);
    if (s) removeClass(s, "sel");
    if (s === b){ G.sel = null; return; }
    G.sel = b; addClass(b, "sel");
    return;
  }
  removeClass(s, "sel"); G.sel = null;
  if (s.pair === b.pair) match(s, b, w);
  else miss(s, b, w);
}

function match(x, y, w){
  addClass(x, "done"); addClass(y, "done");
  var l = x.side === "L" ? x : y, r = x.side === "L" ? y : x;
  drawLine(l, r);
  G.matched++;
  var p = x.pair;
  if (RHYME) say(w.concat(["p_rhyme_" + Math.floor(Math.random()*3)]));
  else say([key(p.a), "p_praise_" + Math.floor(Math.random()*6)]);
  if (G.matched === G.pairs.length) boardDone();
}
function miss(x, y, w){
  G.mistakes++;
  [x, y].forEach(function(t){ removeClass(t, "nope"); void t.offsetWidth; addClass(t, "nope"); });
  say((w || []).concat(["p_try"]));
}

function drawLine(l, r){ G.links.push([l, r]); paintLines(); }
/* lines are measured from where the cards are now, so they're redrawn when the frame turns
   (portrait <-> landscape moves every card) */
function paintLines(){
  if (!G || !G.svg) return;
  while (G.svg.firstChild) G.svg.removeChild(G.svg.firstChild);
  var br = G.boardEl.getBoundingClientRect();
  G.links.forEach(function(lr){
    var a = lr[0].getBoundingClientRect(), b = lr[1].getBoundingClientRect();
    var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", a.right - br.left); line.setAttribute("y1", a.top + a.height/2 - br.top);
    line.setAttribute("x2", b.left - br.left);  line.setAttribute("y2", b.top + b.height/2 - br.top);
    line.setAttribute("stroke", "#7CFFB2"); line.setAttribute("stroke-width", "7"); line.setAttribute("stroke-linecap", "round");
    G.svg.appendChild(line);
  });
}
window.addEventListener("resize", function(){ setTimeout(paintLines, 50); }, false);

function boardDone(){
  G.locked = true;
  var clean = G.mistakes === 0;
  if (clean) G.stars++;
  G.results[G.board] = clean ? "gold" : "ok";
  renderDots();
  confetti(G.boardEl);
  setTimeout(function(){
    G.board++;
    if (G.board >= BOARDS) showEnd(); else Ways.between(renderBoard);
  }, 2200);
}

function showEnd(){
  var i = G.level, s = G.stars;
  G.done = true;
  if (best[i] === undefined || s > best[i]){ best[i] = s; save("best", best); }
  $("endTitle").textContent = s === BOARDS ? "Perfect!" : s >= 3 ? "Amazing matching!" : "Level done!";
  $("endScore").innerHTML = "You earned <b>&#9733; " + s + "</b> of " + BOARDS + " stars.";
  var btns = $("endBtns"); btns.innerHTML = "";
  var again = el("button", "paper press bigbtn", "Play again"); again.onclick = function(){ startLevel(i); }; btns.appendChild(again);
  if (i < GAME.names.length - 1){
    var nx = el("button", "paper press bigbtn go", "Next: " + GAME.names[i + 1]); nx.onclick = function(){ startLevel(i + 1); }; btns.appendChild(nx);
  }
  var all = el("button", "paper press bigbtn", "All levels"); all.onclick = function(){ renderHome(); show("home"); }; btns.appendChild(all);
  show("end");
  say([s === BOARDS ? "p_perfect" : "p_stars_" + s]);
}

function confetti(target){
  var r = target.getBoundingClientRect();
  for (var i = 0; i < 24; i++){
    (function(i){
      var b = el("span", "bit");
      b.style.left = (r.left + r.width/2) + "px";
      b.style.top = (r.top + r.height/2) + "px";
      b.style.background = COLORS[i % COLORS.length];
      document.body.appendChild(b);
      var dx = Math.random()*500 - 250, dy = -(Math.random()*300 + 40), rot = Math.random()*540;
      setTimeout(function(){
        var t = "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)";
        b.style.webkitTransform = t; b.style.transform = t; b.style.opacity = "0";
      }, 20);
      setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 1000);
    })(i);
  }
}

(function(){
  var sky = $("sky");
  for (var i = 0; i < 70; i++){
    var st = el("span", "star"), size = Math.random() < 0.15 ? 0.6 : 0.3;
    st.style.left = (Math.random()*100) + "%"; st.style.top = (Math.random()*100) + "%";
    st.style.width = st.style.height = size + "vmin";
    st.style.webkitAnimationDelay = st.style.animationDelay = (Math.random()*3) + "s";
    sky.appendChild(st);
  }
})();

/* hook for automated tests (harmless on the frame) */
window.MatchGame = { game:function(){ return GAME; }, state:function(){ return G; }, start:startLevel, makeBoard:makeBoard };

document.addEventListener("touchstart", function(){}, true);
renderHome();
})();
</script>
</body>
</html>

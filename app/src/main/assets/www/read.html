<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="parent" content="words.html">
<title>Read and Answer</title>
<style>
@font-face{font-family:"WHRead";src:url("fonts/andika.ttf") format("truetype");font-weight:400}
@font-face{font-family:"WHRead";src:url("fonts/andika-bold.ttf") format("truetype");font-weight:700}
@font-face{font-family:"WHFun";src:url("fonts/fredoka.ttf") format("truetype");font-weight:600}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#0B1026;background-image:radial-gradient(circle at 30% 15%, #2A1E5C 0%, #131A3D 45%, #0B1026 80%);color:#F3F6FF;font-family:"WHFun","Trebuchet MS",sans-serif;font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);overflow:hidden;
}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;outline:none}
img{display:block}
.screen{display:none;position:absolute;left:0;top:0;right:0;bottom:0;padding:3vmin 4vmin;overflow:hidden;z-index:1}
.screen.on{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.paper{background:#F7F9FF;color:#1F2A44;border:0.5vmin solid #1F2A44;border-radius:2.8vmin;box-shadow:0.8vmin 0.8vmin 0 #05081A}
.press{-webkit-transition:-webkit-transform .08s,box-shadow .08s,background .15s;transition:transform .08s,box-shadow .08s,background .15s}
.press:active{-webkit-transform:translate(0.5vmin,0.5vmin);transform:translate(0.5vmin,0.5vmin);box-shadow:0.3vmin 0.3vmin 0 #05081A}
.flex{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}

/* level list */
.hero{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin:2vmin 0 4vmin}
.hero img{width:12vmin;height:12vmin;-webkit-flex:none;flex:none;margin-right:3vmin}
.hero h1{margin:0;font-size:9vmin;line-height:1;font-weight:600;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.hero p{margin:1vmin 0 0;font-size:3.6vmin;color:#B9C3F2}
.path{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -1.2vmin}
.stone{width:18%;margin:1.2vmin 1%;padding:2.2vmin 2.4vmin;text-align:left;min-height:26vmin;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.num{width:7vmin;height:7vmin;border-radius:50%;border:0.5vmin solid #1F2A44;font-size:3.6vmin;line-height:6vmin;text-align:center;color:#1F2A44}
.sname{font-size:3.4vmin;margin-top:1.4vmin}
.ex{font-family:"WHRead",sans-serif;font-weight:400;font-size:3vmin;color:#4F5F80;margin-top:.6vmin}
.best{margin-top:auto;padding-top:1vmin;font-size:2.6vmin;color:#4F5F80}
.best b{color:#1F2A44}
.foot{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;margin-top:auto;padding-top:2vmin}
.credit{font-size:1.8vmin;color:#7F8AC0;width:100%}

/* game */
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:1vmin}
.dots{-webkit-flex:1;flex:1;text-align:center;font-size:0}
.dot{display:inline-block;width:3.6vmin;height:3.6vmin;border-radius:50%;border:0.45vmin solid #5CE1E6;background:#131A3D;margin:0 .8vmin}
.dot.now{background:#5CE1E6}.dot.gold{background:#FFD93D;border-color:#FFD93D}.dot.ok{background:#7CFFB2;border-color:#7CFFB2}
.stars{font-size:4vmin;min-width:13vmin;text-align:right;color:#FFD93D}
.stage{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;min-height:0}
.hintrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:2vmin}
.hint{margin:0;font-size:3.8vmin;color:#B9C3F2;text-align:center}
.sayb{width:8vmin;height:8vmin;border-radius:50%;background:#FFD93D;margin-left:2vmin;-webkit-flex:none;flex:none}
.sayb img{width:5vmin;height:5vmin}
/* the story on paper, the question under it, then the answers */
.story{width:100%;max-width:150vmin;padding:3vmin 4vmin;font-family:"WHRead",sans-serif;font-weight:400;font-size:5.6vmin;line-height:1.55;text-align:left}
.story img{display:inline-block;width:7vmin;height:7vmin;vertical-align:middle;margin-right:2vmin}
.story .ev{border-radius:1vmin;-webkit-transition:background .3s;transition:background .3s}
.story.show .ev{background:#FFE36B;box-shadow:0 0 0 0.6vmin #FFE36B}
.qline{margin:3vmin 0 0;font-family:"WHRead",sans-serif;font-weight:700;font-size:5vmin;color:#FFD93D;text-align:center;line-height:1.3}
.choices{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;margin-top:2.6vmin}
.choice{min-width:24vmin;margin:1vmin 1.4vmin;padding:2.2vmin 3.6vmin;font-family:"WHRead",sans-serif;font-weight:700;font-size:4.6vmin;border-radius:2.4vmin;line-height:1.2}
.choice.right{background:#7CFFB2}
.choice.wrong{background:#FFC2E6;opacity:.55}
.nope{-webkit-animation:shake .4s;animation:shake .4s}
@-webkit-keyframes shake{20%{-webkit-transform:translateX(-1.4vmin)}40%{-webkit-transform:translateX(1.4vmin)}60%{-webkit-transform:translateX(-.8vmin)}80%{-webkit-transform:translateX(.8vmin)}}
@keyframes shake{20%{transform:translateX(-1.4vmin)}40%{transform:translateX(1.4vmin)}60%{transform:translateX(-.8vmin)}80%{transform:translateX(.8vmin)}}

/* end */
.endbox{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}
.endbox img{width:18vmin;height:18vmin}
.endbox h2{margin:2vmin 0 1vmin;font-size:10vmin;font-weight:600;line-height:1;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.score{font-size:4.4vmin;color:#B9C3F2}
.score b{color:#FFD93D}
.endbtns{margin-top:4vmin;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.bigbtn{padding:2.4vmin 4vmin;font-size:3.8vmin;border-radius:2.6vmin;margin:1vmin 1.4vmin}
.bigbtn.go{background:#7CFFB2;color:#14193A}

.bit{position:fixed;width:1.8vmin;height:1.8vmin;border-radius:.4vmin;pointer-events:none;z-index:9;
  -webkit-transition:-webkit-transform .9s ease-out,opacity .9s ease-out;transition:transform .9s ease-out,opacity .9s ease-out}
#sky{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;-webkit-animation:twinkle 3s ease-in-out infinite;animation:twinkle 3s ease-in-out infinite}
@-webkit-keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@media (orientation: portrait){
  .stone{width:48%}
  .dot{width:3vmin;height:3vmin;margin:0 .4vmin}
  .story{font-size:5.4vmin}
  .choices{-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:stretch;align-items:stretch;width:80%}
}
</style>
<link rel="stylesheet" href="back.css">
</head>
<body>
<div id="sky"></div>
<button class="backbtn" id="backBtn" aria-label="Back"><b>&#8592;</b>Back</button>

<section class="screen on" id="home">
  <div class="hero backroom">
    <img src="emoji/1f4da.svg" alt="">
    <div><h1>Read and Answer</h1><p>Read the story, then answer the question.</p></div>

  <div class="foot">

</section>

<section class="screen" id="game">
  <div class="bar">
    <span class="barspace"></span>
    <div class="dots" id="dots"></div>
    <div class="stars" id="stars"></div>
  </div>
  <div class="stage" id="stage"></div>
</section>

<section class="screen" id="end">
  <div class="endbox">
    <img src="emoji/1f47d.svg" alt="">
    <h2 id="endTitle"></h2>
    <div class="score" id="endScore"></div>
    <div class="endbtns" id="endBtns"></div>
  </div>
</section>

    "Sam dropped his ice cream on the ground. His lip shook and he began to cry. | How does Sam feel? | sad | happy | sleepy | he began to cry",
    "Mia put on her coat, hat, and mittens. She could see her breath in the air. | What is the weather like? | cold | hot | rainy | She could see her breath",
    "Ben yawned and rubbed his eyes. He could not stop yawning. | How does Ben feel? | sleepy | angry | scared | Ben yawned and rubbed his eyes",
    "Kim grabbed her umbrella and her rain boots before she went out. | What is the weather like? | rainy | sunny | hot | her umbrella and her rain boots",
    "The dark clouds rolled in. There was a loud boom, and the lights flashed. | What is happening? | a storm | a party | a parade | There was a loud boom",
    "Max jumped up and down and cheered. He gave his team a high five. | How does Max feel? | happy | sad | tired | jumped up and down and cheered",
    "The glass was on the edge of the table. The cat swished its tail and bumped it. | What will happen next? | the glass will fall | the cat will sleep | the glass will fill up | on the edge of the table",
    "Liv heard a creak in the dark. She pulled the blanket over her head. | How does Liv feel? | scared | silly | hungry | She pulled the blanket over her head",
    "Tom had not eaten all day. His tummy growled loudly. | How does Tom feel? | hungry | full | cold | His tummy growled",
    "Zoe put on her swimsuit and grabbed a towel. Dad packed a bucket and a shovel. | Where are they going? | to the beach | to school | to the store | a bucket and a shovel",
    "Ann saw a box with holes in the top. Something inside said meow! | What is in the box? | a kitten | a puppy | a bird | said meow",
    "Jack held the string. His kite went up, up, up into the sky. | What kind of day is it? | a windy day | a snowy day | a rainy day | His kite went up, up, up",
    "The candles were lit, and everyone sang to Mia. She took a big breath. | What will Mia do next? | blow out the candles | go to sleep | eat a pickle | She took a big breath",
    "Sam built a tall tower of blocks. His baby brother crawled over to it. | What might happen next? | the tower falls down | the tower grows | Sam goes to bed | His baby brother crawled over to it",
    "Kim put the seeds in the dirt. Every day she gave them water. | What will happen to the seeds? | they will grow | they will melt | they will fly | Every day she gave them water",
    "The puppy licked Ben on the nose and wagged its tail. | How does the puppy feel? | happy | mad | sad | wagged its tail",
    "Max put on his pajamas and brushed his teeth. Mom turned off the light. | What time is it? | bedtime | lunchtime | playtime | put on his pajamas",
    "Liv left her cookie on the table. When she came back, it was gone. The dog had crumbs on his nose. | Who ate the cookie? | the dog | Liv | the cat | The dog had crumbs on his nose",
    "Zib looked out of his spaceship. He saw a big blue and green ball with white clouds. | What did Zib see? | the Earth | the sun | the moon | a big blue and green ball with white clouds",
    "Ben made a mess with his paints. He said sorry and cleaned it all up. | What kind of kid is Ben? | helpful | mean | lazy | cleaned it all up",
    "Tom wore shorts and sunglasses. He drank lots of cold water. | What is the weather like? | hot | cold | snowy | Tom wore shorts and sunglasses",
    "Mia gave half of her sandwich to a friend who forgot lunch. | What kind of friend is Mia? | kind | mean | silly | gave half of her sandwich",
    "The ice cream sat in the sun for a long time. | What will happen to the ice cream? | it will melt | it will freeze | it will grow | sat in the sun for a long time",
    "Kim stood at the top of the tall slide. Her hands shook, and she did not want to go down. | How does Kim feel? | scared | bored | happy | Her hands shook",
    "Dad looked at the flat tire. He got out a pump. | What will Dad do? | fill the tire with air | buy a new car | eat lunch | He got out a pump",
    "Sam heard the ice cream truck. He ran to get his money. | What does Sam want? | ice cream | a new toy | a nap | heard the ice cream truck"
  ]}
];
LEVELS.forEach(function(L){
  L.items = L.raw.map(function(line){ var f = line.split(" | "); return { story:f[0], q:f[1], a:f[2], wrong:[f[3], f[4]], clue:f[5] }; });
});
var ROUNDS = 8;
var COLORS = ["#FFC93C","#FF8A3D","#E5487A","#3FB37F","#4BA3D9"];

function load(k, d){ try { var v = localStorage.getItem("read:" + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem("read:" + k, JSON.stringify(v)); } catch(e){} }
var best = load("best", {});
var recent = load("recent", {});   // per level, the stories played lately: the next level game picks others first

/* ---------- level list ---------- */
function renderHome(){
  var path = $("path"); path.innerHTML = "";
  LEVELS.forEach(function(L, i){
    var b = el("button", "paper press stone"), got = best[i];
    b.innerHTML = '<span class="num" style="background:' + COLORS[i] + '">' + (i + 1) + '</span>' +
      '<span class="sname">' + L.name + '</span><span class="ex">' + L.ex + '</span>' +
      '<span class="best">' + (got === undefined ? "Not played yet" : 'Best: <b>&#9733; ' + got + '</b> of ' + ROUNDS) + '</span>';
    b.onclick = function(){ startLevel(i); };
    path.appendChild(b);
  });
}
function goBack(){ Speech.stop(); if (hasClass($("home"), "on")) location.href = "words.html"; else { G = null; renderHome(); show("home"); } }
$("backBtn").onclick = goBack;
window.goBack = goBack;

/* ---------- playing ---------- */
var G = null;
/* 8 stories, the ones not played lately first (each level has about 26) */
function pickStories(level){
  var items = LEVELS[level].items, seen = recent[level] || [], fresh = [], old = [];
  shuffle(items.map(function(x, i){ return i; })).forEach(function(i){ (seen.indexOf(i) >= 0 ? old : fresh).push(i); });
  var pickIdx = fresh.concat(old).slice(0, ROUNDS);
  recent[level] = seen.concat(pickIdx).slice(-(items.length - ROUNDS)); save("recent", recent);
  return pickIdx.map(function(i){ return items[i]; });
}
function startLevel(i){
  G = { level:i, items:pickStories(i), round:0, stars:0, results:[] };
  show("game");
  renderRound();
}
function renderDots(){
  var d = $("dots"); d.innerHTML = "";
  for (var i = 0; i < ROUNDS; i++){
    var r = G.results[i];
    d.appendChild(el("span", "dot" + (r === "gold" ? " gold" : r === "ok" ? " ok" : i === G.round ? " now" : "")));
  }
  $("stars").innerHTML = "&#9733; " + G.stars;
}
function renderRound(){
  var it = G.items[G.round], R = { it:it, misses:0, done:false };
  G.R = R;
  renderDots();
  var stage = $("stage"); stage.innerHTML = "";
  var hr = el("div", "hintrow");
  hr.appendChild(el("p", "hint", Speech.tapText("Read the story. Then tap the answer.")));
  if (Speech.canTalk()){
    var sb = el("button", "press sayb flex", '<img src="emoji/1f50a.svg" alt="">');
    sb.setAttribute("aria-label", "Hear the instructions");
    sb.onclick = function(){ say(["i_read_answer"]); };
    hr.appendChild(sb);
  }
  stage.appendChild(hr);
  var at = it.story.indexOf(it.clue);
  var story = el("div", "paper story", '<img src="emoji/1f4da.svg" alt="">');
  story.innerHTML = Speech.tapText(it.story.slice(0, at)) + '<span class="ev">' + Speech.tapText(it.clue) + '</span>' + Speech.tapText(it.story.slice(at + it.clue.length));
  stage.appendChild(story);
  stage.appendChild(el("p", "qline", Speech.tapText(it.q)));
  var ch = el("div", "choices");
  shuffle([it.a].concat(it.wrong)).forEach(function(c){
    var b = el("button", "paper press choice", c);
    b.setAttribute("data-ans", c);
    b.onclick = function(){ answer(R, b, c); };
    if (c === it.a) R.right = b;
    ch.appendChild(b);
  });
  stage.appendChild(ch);
  R.story = story; R.choices = ch;
  if (G.round === 0) setTimeout(function(){ if (G && G.R === R) say(["i_read_answer"]); }, 400);
}
function answer(R, b, c){
  if (!G || G.R !== R || R.done || hasClass(b, "wrong")) return;
  if (c !== R.it.a){
    R.misses++; addClass(b, "wrong");
    removeClass(R.choices, "nope"); void R.choices.offsetWidth; addClass(R.choices, "nope");
    if (R.misses < 2){ say(["p_try"]); return; }
    finish(R, ["p_story_says"]);
    return;
  }
  finish(R, ["p_praise_" + Math.floor(Math.random()*6)]);
}
/* right (or 2 misses): light up the clue in the story, then the next story */
function finish(R, keys){
  R.done = true;
  addClass(R.right, "right");
  addClass(R.story, "show");
  var clean = R.misses === 0;
  if (clean) G.stars++;
  G.results[G.round] = clean ? "gold" : "ok";
  renderDots();
  var moved = false;
  function next(){ if (moved || !G || G.R !== R) return; moved = true; G.round++; if (G.round >= ROUNDS) showEnd(); else Ways.between(renderRound); }
  say(keys, function(){ setTimeout(next, R.misses ? 2600 : 1400); });
  setTimeout(next, 9000);
}
function showEnd(){
  var i = G.level, s = G.stars;
  if (best[i] === undefined || s > best[i]){ best[i] = s; save("best", best); }
  $("endTitle").textContent = s === ROUNDS ? "Perfect!" : s >= 6 ? "Super reading!" : "Level done!";
  $("endScore").innerHTML = "You earned <b>&#9733; " + s + "</b> of " + ROUNDS + " stars.";
  var btns = $("endBtns"); btns.innerHTML = "";
  var again = el("button", "paper press bigbtn", "Play again"); again.onclick = function(){ startLevel(i); }; btns.appendChild(again);
  if (i < LEVELS.length - 1){
    var nx = el("button", "paper press bigbtn go", "Next: " + LEVELS[i + 1].name); nx.onclick = function(){ startLevel(i + 1); }; btns.appendChild(nx);
  }
  var all = el("button", "paper press bigbtn", "All levels"); all.onclick = function(){ renderHome(); show("home"); }; btns.appendChild(all);
  show("end");
  say([s === ROUNDS ? "p_perfect" : "p_stars_" + s]);
}

(function(){
  var sky = $("sky");
  for (var i = 0; i < 70; i++){
    var st = el("span", "star"), size = Math.random() < 0.15 ? 0.6 : 0.3;
    st.style.left = (Math.random()*100) + "%"; st.style.top = (Math.random()*100) + "%";
    st.style.width = st.style.height = size + "vmin";
    st.style.webkitAnimationDelay = st.style.animationDelay = (Math.random()*3) + "s";
    sky.appendChild(st);
  }
})();

/* hooks for automated tests (harmless on the frame) */
window.ReadAnswer = { levels:LEVELS, rounds:ROUNDS, state:function(){ return G; }, start:startLevel };

document.addEventListener("touchstart", function(){}, true);
renderHome();
})();
</script>

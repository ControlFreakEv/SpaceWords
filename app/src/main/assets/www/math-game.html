<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="parent" content="math.html">
<title>Math games</title>
<style>
@font-face{font-family:"WHFun";src:url("fonts/fredoka.ttf") format("truetype");font-weight:600}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#0B1026;background-image:radial-gradient(circle at 75% 15%, #2A1E5C 0%, #131A3D 45%, #0B1026 80%);color:#F3F6FF;font-family:"WHFun","Trebuchet MS",sans-serif;font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);overflow:hidden;
}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;outline:none}
img{display:block}
.screen{display:none;position:absolute;left:0;top:0;right:0;bottom:0;padding:3vmin 4vmin;overflow:hidden;z-index:1}
.screen.on{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.paper{background:#F7F9FF;color:#1F2A44;border:0.5vmin solid #1F2A44;border-radius:2.8vmin;box-shadow:0.8vmin 0.8vmin 0 #05081A}
.press{-webkit-transition:-webkit-transform .08s,box-shadow .08s;transition:transform .08s,box-shadow .08s}
.press:active{-webkit-transform:translate(0.5vmin,0.5vmin);transform:translate(0.5vmin,0.5vmin);box-shadow:0.3vmin 0.3vmin 0 #05081A}
.flex{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}

/* level list */
.hero{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin:2vmin 0 4vmin}
.hero img{width:12vmin;height:12vmin;-webkit-flex:none;flex:none;margin-right:3vmin;-webkit-animation:hop 1.6s ease-out 1;animation:hop 1.6s ease-out 1}
@-webkit-keyframes hop{0%{-webkit-transform:translateY(5vmin) scale(.6);opacity:0}35%{-webkit-transform:translateY(-5vmin) scale(1.05);opacity:1}55%{-webkit-transform:translateY(0) scaleY(.88)}70%{-webkit-transform:translateY(-1.5vmin)}100%{-webkit-transform:none}}
@keyframes hop{0%{transform:translateY(5vmin) scale(.6);opacity:0}35%{transform:translateY(-5vmin) scale(1.05);opacity:1}55%{transform:translateY(0) scaleY(.88)}70%{transform:translateY(-1.5vmin)}100%{transform:none}}
.hero h1{margin:0;font-size:9vmin;line-height:1;font-weight:600;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.hero p{margin:1vmin 0 0;font-size:3.6vmin;color:#B9C3F2}
.path{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -1.2vmin}
.stone{width:18%;margin:1.2vmin 1%;padding:2.2vmin 2.4vmin;text-align:left;min-height:26vmin;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.num{width:7vmin;height:7vmin;border-radius:50%;border:0.5vmin solid #1F2A44;font-size:3.6vmin;line-height:6vmin;text-align:center;color:#1F2A44}
.sname{font-size:3.4vmin;margin-top:1.4vmin}
.ex{font-size:3vmin;color:#4F5F80;margin-top:.6vmin}
.grade{font-size:2.4vmin;color:#7F8AC0;margin-top:.4vmin}
.best{margin-top:auto;padding-top:1vmin;font-size:2.6vmin;color:#4F5F80}
.best b{color:#1F2A44}
.foot{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;margin-top:auto;padding-top:2vmin}
.foot > *{margin:0 2vmin 1.4vmin 0}
.pill{padding:1.6vmin 2.8vmin;font-size:2.8vmin;border-radius:10vmin}
.note{font-size:2.4vmin;color:#B9C3F2}
.credit{font-size:1.8vmin;color:#7F8AC0;width:100%}

/* game */
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:1.4vmin}
.icon-btn{width:9vmin;height:9vmin;-webkit-flex:none;flex:none}
.icon-btn img{width:5.5vmin;height:5.5vmin}
.dots{-webkit-flex:1;flex:1;text-align:center;font-size:0}
.dot{display:inline-block;width:3.2vmin;height:3.2vmin;border-radius:50%;border:0.45vmin solid #5CE1E6;background:#131A3D;margin:0 .6vmin}
.dot.now{background:#5CE1E6}.dot.gold{background:#FFD93D;border-color:#FFD93D}.dot.ok{background:#7CFFB2;border-color:#7CFFB2}
.stars{font-size:4vmin;min-width:13vmin;text-align:right;color:#FFD93D}
.stage{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-around;justify-content:space-around}
.hintrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.hint{margin:0;font-size:4.2vmin;color:#B9C3F2;text-align:center}
.sayb{width:8vmin;height:8vmin;border-radius:50%;background:#FFD93D;margin-left:2vmin;-webkit-flex:none;flex:none}
.sayb img{width:5vmin;height:5vmin}
.prompt{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.prompt.col{-webkit-flex-direction:column;flex-direction:column}
.op{font-size:10vmin;margin:0 2vmin;color:#FFD93D}

/* ten-frames */
.frame{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;width:39.6vmin;margin:1vmin;background:#131A3D;border:0.5vmin solid #5CE1E6;border-radius:1.6vmin;padding:.4vmin}
.cell{position:relative;width:7vmin;height:7vmin;margin:.2vmin;border:0.25vmin dashed rgba(92,225,230,.35);border-radius:1vmin;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.cell img{width:5.6vmin;height:5.6vmin}
.cell.x img{opacity:.35}
.cell.x:after{content:"";position:absolute;left:8%;right:8%;top:46%;height:.8vmin;border-radius:.4vmin;background:#FF5C7A;-webkit-transform:rotate(-40deg);transform:rotate(-40deg)}
.sm .frame{width:31.6vmin;padding:.3vmin;margin:.6vmin}
.sm .cell{width:5.6vmin;height:5.6vmin;margin:.15vmin}
.sm .cell img{width:4.6vmin;height:4.6vmin}
.groups{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;max-width:120vmin}
.grp{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;width:19vmin;min-height:13vmin;margin:1vmin;padding:1vmin;border:0.5vmin solid #FF9ED8;border-radius:50%;background:#131A3D;-webkit-align-content:center;align-content:center}
.grp img{width:5.4vmin;height:5.4vmin;margin:.3vmin}

/* place value */
.pv{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;padding:2vmin;background:#131A3D;border:0.5vmin solid #5CE1E6;border-radius:2vmin}
.rod{margin:0 .7vmin}
.rod span,.ones span{display:block;width:4vmin;height:2.6vmin;background:#FFD93D;border:0.3vmin solid #1F2A44;margin-top:-.3vmin}
.ones{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap-reverse;flex-wrap:wrap-reverse;width:9vmin;margin-left:3vmin}
.ones span{width:4vmin;height:4vmin;background:#7CFFB2;margin:.2vmin;border-radius:.6vmin}
.pvkey{font-size:3vmin;color:#B9C3F2;margin-top:1.4vmin}

/* equations, sequences */
.eq{font-size:12vmin;line-height:1.1;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;margin:1vmin 0}
.eq.small{font-size:8vmin}
.eq span{margin:0 1.4vmin}
.q{display:inline-block;min-width:13vmin;padding:0 1.6vmin;text-align:center;border-radius:2vmin;background:#FFD93D;color:#1F2A44;border:0.5vmin solid #1F2A44}
.q.reveal{background:#FF9E5C}
/* adding and taking away with 2-digit numbers: stacked, so ones sit under ones and tens under tens.
   Every row has the answer box's padding and border, so the digit columns line up exactly. */
.colsum{display:-webkit-inline-flex;display:inline-flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:flex-end;align-items:flex-end;
  font-size:10vmin;line-height:1.08;margin:1vmin 0}
.crow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.cop{width:9vmin;text-align:center;margin-right:1.4vmin}
.cnum{display:-webkit-flex;display:flex;padding:0 1.6vmin;border:0.5vmin solid transparent}
.dg{display:block;width:.66em;text-align:center;font-style:normal}
.cnum .p0{color:#7CFFB2}.cnum .p1{color:#FFD93D}.cnum .p2{color:#FF9ED8}
.cbar{-webkit-align-self:stretch;align-self:stretch;height:0;border-top:0.8vmin solid #F3F6FF;border-radius:.4vmin;margin:.6vmin 0 1.2vmin}
.q.colq{min-width:0;display:-webkit-flex;display:flex;-webkit-justify-content:flex-end;justify-content:flex-end}
.bignum{font-size:20vmin;line-height:1;color:#FFD93D;text-shadow:0.8vmin 0.8vmin 0 #05081A}
.seq{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.bub{min-width:13vmin;height:13vmin;margin:1vmin;padding:0 1.6vmin;font-size:7.5vmin;border-radius:6.5vmin;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.bub img{width:9vmin;height:9vmin}
.bub.q{background:#FFD93D;color:#1F2A44;min-width:13vmin}
/* the pattern's rule, shown once she gets it right */
.step{font-size:4.2vmin;color:#7CFFB2;visibility:hidden;margin:0 .2vmin;min-width:6vmin;text-align:center}
.seq.solved .step{visibility:visible}
.rule{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  margin-top:1.4vmin;padding:1vmin 3vmin;border-radius:3vmin;background:#131A3D;border:0.5vmin solid #7CFFB2;font-size:4.8vmin;color:#F3F6FF}
.rule b{color:#7CFFB2;margin-right:1.4vmin;font-weight:600}
.rule img{width:6.4vmin;height:6.4vmin;margin:0 .5vmin}
.rule .brk{color:#7CFFB2;font-size:6vmin;margin:0 .6vmin}

/* answers */
.choices{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;width:100%}
.choice{margin:0 1.6vmin;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.choice.n{width:19vmin;height:15vmin;font-size:8.5vmin}
.choice.g{padding:1vmin;background:#1B2457;border-color:#5CE1E6}
.choice.e{width:16vmin;height:16vmin}
.choice.e img{width:11vmin;height:11vmin}
.choice.dim{opacity:.35;pointer-events:none}
.choice.right{background:#7CFFB2;color:#14193A}
.nope{-webkit-animation:shake .4s;animation:shake .4s}
@-webkit-keyframes shake{20%{-webkit-transform:translateX(-1.4vmin)}40%{-webkit-transform:translateX(1.4vmin)}60%{-webkit-transform:translateX(-.8vmin)}80%{-webkit-transform:translateX(.8vmin)}}
@keyframes shake{20%{transform:translateX(-1.4vmin)}40%{transform:translateX(1.4vmin)}60%{transform:translateX(-.8vmin)}80%{transform:translateX(.8vmin)}}

/* keypad rounds */
.padrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-around;justify-content:space-around;width:100%;-webkit-flex:1;flex:1}
.padleft{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-around;justify-content:space-around;-webkit-flex:1;flex:1;height:100%}
.pad{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;width:44vmin;-webkit-flex:none;flex:none}
.key{width:12.6vmin;height:12vmin;margin:.8vmin;font-size:6.4vmin;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.key.go{background:#7CFFB2}
.key.del{background:#FFD9E6}

/* end */
.endbox{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}
.endbox img{width:18vmin;height:18vmin}
.endbox h2{margin:2vmin 0 1vmin;font-size:10vmin;font-weight:600;line-height:1;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.score{font-size:4.4vmin;color:#B9C3F2}
.score b{color:#FFD93D}
.endbtns{margin-top:4vmin;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.bigbtn{padding:2.4vmin 4vmin;font-size:3.8vmin;border-radius:2.6vmin;margin:1vmin 1.4vmin}
.bigbtn.go{background:#7CFFB2;color:#14193A}

.bit{position:fixed;width:1.8vmin;height:1.8vmin;border-radius:.4vmin;pointer-events:none;z-index:9;
  -webkit-transition:-webkit-transform .9s ease-out,opacity .9s ease-out;transition:transform .9s ease-out,opacity .9s ease-out}
#sky{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;-webkit-animation:twinkle 3s ease-in-out infinite;animation:twinkle 3s ease-in-out infinite}
@-webkit-keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@media (orientation: portrait){
  .stone{width:48%}
  .padrow{-webkit-flex-direction:column;flex-direction:column}
  .hero h1{font-size:10vmin}
}
</style>

</head>
<body>
<div id="sky"></div>
<button class="backbtn" id="backBtn" aria-label="Back"><b>&#8592;</b>Back</button>

<section class="screen on" id="home">
  <div class="hero backroom">
    <img id="heroImg" src="emoji/1f31f.svg" alt="">
    <div><h1 id="heroTitle"></h1><p id="heroSub"></p></div>
  </div>
  <div class="path" id="path"></div>
  <div class="foot">
    <span class="note" id="speechNote" style="display:none">Talking isn't set up on this device yet. Questions are still written on screen.</span>
    <span class="credit">Pictures: Twemoji by Twitter and contributors, CC-BY 4.0</span>
  </div>
</section>

<section class="screen" id="game">
  <div class="bar">
    <span class="barspace"></span>
    <div class="dots" id="dots"></div>
    <div class="stars" id="stars"></div>
  </div>
  <div class="stage" id="stage"></div>
</section>

<section class="screen" id="end">
  <div class="endbox">
    <img src="emoji/1f47d.svg" alt="">
    <h2 id="endTitle"></h2>
    <div class="score" id="endScore"></div>
    <div class="endbtns" id="endBtns"></div>
  </div>
</section>

<script src="speech.js"></script>
<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function ri(lo, hi){ return lo + Math.floor(Math.random()*(hi - lo + 1)); }
function hasClass(e, c){ return (" " + e.className + " ").indexOf(" " + c + " ") >= 0; }
function addClass(e, c){ if (!hasClass(e, c)) e.className += " " + c; }
function removeClass(e, c){ e.className = (" " + e.className + " ").replace(" " + c + " ", " ").replace(/^\s+|\s+$/g, ""); }
function show(id){ ["home","game","end"].forEach(function(s){ $(s).className = "screen" + (s === id ? " on" : ""); }); document.body.setAttribute("data-screen", id); }
function n(k){ return "n_" + k; }
var MINUS = "&#8722;", TIMES = "&#215;", DIVIDE = "&#247;";

/* things to count: emoji code and plural name */
var THINGS = [["2b50","stars"],["1f47d","aliens"],["1f680","rockets"],["1f319","moons"],["1fa90","planets"],["1f6f8","flying saucers"],
  ["1f34e","apples"],["1f36a","cookies"],["1f41e","ladybugs"],["1f388","balloons"],["1f6f0","satellites"],["1f320","shooting stars"]];
function img(code){ return '<img src="emoji/' + code + '.svg" alt="">'; }

/* n objects in ten-frames; the last `cross` of them crossed out (taken away) */
function frames(count, code, cross){
  var out = "", frameCount = Math.max(1, Math.ceil(count / 10));
  for (var f = 0; f < frameCount; f++){
    out += '<div class="frame">';
    for (var c = 0; c < 10; c++){
      var i = f*10 + c, x = cross && i >= count - cross && i < count;
      out += '<div class="cell' + (x ? " x" : "") + '">' + (i < count ? img(code) : "") + '</div>';
    }
    out += '</div>';
  }
  return out;
}

/* four answer choices around the right one, kept inside lo..hi */
function numOpts(ans, lo, hi, extras, count){
  var want = count || 4, set = [ans];
  var cands = shuffle((extras || []).concat([ans+1, ans-1, ans+2, ans-2, ans+10, ans-10]));
  for (var i = 0; i < cands.length && set.length < want; i++){
    var c = cands[i];
    if (c >= lo && c <= hi && set.indexOf(c) < 0) set.push(c);
  }
  var guard = 0;
  while (set.length < want && guard++ < 200){ var r = ri(lo, hi); if (set.indexOf(r) < 0) set.push(r); }
  return shuffle(set).map(function(v){ return { html:String(v), val:v, cls:"n" }; });
}

/* ---------- round makers ----------
   Each returns { hint, say, prompt, kind:"choice"|"pad", options, answer, answerSay }.
   For keypad rounds the prompt contains <span class="q" id="entry">?</span>. */
var Q = '<span class="q" id="entry">?</span>';

function rCount(lo, hi){
  var k = ri(lo, hi), t = pick(THINGS);
  return { hint:"How many " + t[1] + "?", say:["m_how_many"], prompt:frames(k, t[0]),
    kind:"choice", options:numOpts(k, 0, hi + 2), answer:k, answerSay:[n(k)] };
}
function rFindGroup(lo, hi){
  var k = ri(lo, hi), t = pick(THINGS), set = [k], guard = 0;
  while (set.length < 3 && guard++ < 100){ var o = k + pick([-3,-2,-1,1,2,3]); if (o >= 1 && o <= hi && set.indexOf(o) < 0) set.push(o); }
  return { hint:"Tap the group with " + k + ".", say:["m_find_group", n(k)], prompt:'<div class="bignum tw" data-say="n_' + k + '">' + k + '</div>',
    kind:"choice", options:shuffle(set).map(function(v){ return { html:'<div class="sm">' + frames(v, t[0]) + '</div>', val:v, cls:"g" }; }),
    answer:k, answerSay:[n(k)] };
}
function rCompareGroups(lo, hi){
  var a = ri(lo, hi), b, guard = 0;
  do { b = ri(lo, hi); } while ((b === a || Math.abs(a - b) > 6) && guard++ < 100);
  if (b === a) b = a === hi ? a - 1 : a + 1;
  var more = Math.random() < 0.6, t = pick(THINGS), ans = more ? Math.max(a, b) : Math.min(a, b);
  return { hint:"Which group has " + (more ? "more" : "fewer") + " " + t[1] + "?", say:[more ? "m_more" : "m_fewer"], prompt:"",
    kind:"choice", options:[a, b].map(function(v){ return { html:'<div class="sm">' + frames(v, t[0]) + '</div>', val:v, cls:"g" }; }),
    answer:ans, answerSay:[n(ans)] };
}
function rCompareNums(lo, hi){
  var a = ri(lo, hi), b;
  var tens = Math.floor(a / 10), ones = a % 10;
  if (a >= 10 && ones !== 0 && ones !== tens && Math.random() < 0.4) b = ones*10 + tens;   // 46 vs 64
  else { var guard = 0; do { b = ri(lo, hi); } while (b === a && guard++ < 100); }
  if (b === a) b = a + 1;
  var big = Math.random() < 0.6, ans = big ? Math.max(a, b) : Math.min(a, b);
  return { hint:"Which number is " + (big ? "bigger" : "smaller") + "?", say:[big ? "m_bigger" : "m_smaller"], prompt:"",
    kind:"choice", options:[a, b].map(function(v){ return { html:String(v), val:v, cls:"n" }; }), answer:ans, answerSay:[n(ans)] };
}
function bubbles(values, hideIndex, asImages, steps){
  var out = '<div class="seq">';
  for (var i = 0; i < values.length; i++){
    if (i > 0 && steps) out += '<span class="step">' + steps[i - 1] + '</span>';
    if (i === hideIndex) out += '<div class="paper bub q" id="entry">?</div>';
    else if (asImages) out += '<div class="paper bub">' + img(values[i]) + '</div>';
    else out += '<div class="paper bub tw" data-say="n_' + values[i] + '">' + values[i] + '</div>';
  }
  return out + '</div>';
}
function rNeighbor(lo, hi, pad){
  var type = pick(["after","before","between"]), k, vals, hide, say, hint;
  if (type === "after"){ k = ri(lo, hi - 1); vals = [k, k + 1]; hide = 1; hint = "What comes after " + k + "?"; say = ["m_after", n(k)]; }
  else if (type === "before"){ k = ri(lo + 1, hi); vals = [k - 1, k]; hide = 0; hint = "What comes before " + k + "?"; say = ["m_before", n(k)]; }

/* sequences. Each one carries its rule: steps between the numbers, a line of text, and what to say. */
var MINUS_SIGN = "\u2212", TIMES_SIGN = "\u00d7", DIV_SIGN = "\u00f7";

function arithRule(vals){
  var d = vals[1] - vals[0], steps = [];
  for (var i = 1; i < vals.length; i++) steps.push(signed(d));
  return { steps:steps, html:signed(d) + " each time", say:["m_rule", d >= 0 ? "m_plus" : "m_minus", n(Math.abs(d))] };
}
var UNITS = ["AB","AAB","ABB","ABC","AABB","ABAC"];
function rPicturePattern(){
  var unit = pick(UNITS), letters = [], codes = {}, pool = shuffle(THINGS);
  for (var i = 0; i < unit.length; i++){ var L = unit.charAt(i); if (!codes[L]){ codes[L] = pool[letters.length][0]; letters.push(L); } }
  var shown = unit.length*2 + ri(0, unit.length - 1), seq = [];
  for (var s = 0; s <= shown; s++) seq.push(codes[unit.charAt(s % unit.length)]);
  var ans = seq[shown];
  var opts = letters.map(function(L){ return codes[L]; });
  if (opts.length < 3) opts.push(pool[letters.length][0]);
  var unitHtml = unit.split("").map(function(L){ return img(codes[L]); }).join("");
  return { hint:"What comes next?", say:["m_next"], prompt:bubbles(seq, shown, true), kind:"choice",
    options:shuffle(opts).map(function(c){ return { html:img(c), val:c, cls:"e" }; }), answer:ans, answerHtml:img(ans), answerSay:[],
    rule:{ html:'<span class="brk">[</span>' + unitHtml + '<span class="brk">]</span> repeats', say:["m_rule_repeat"] } };
}
function seqRound(vals, missing, pad, rule){
  var hide = missing ? ri(1, vals.length - 2) : vals.length - 1, ans = vals[hide], step = vals[1] - vals[0];
  rule = rule || arithRule(vals);
  var say = [];
  if (!missing) for (var i = 0; i < hide; i++) say.push(n(vals[i]));
  say.push(missing ? "m_missing" : "m_next");
  return { hint:missing ? "What number is missing?" : "What comes next?", say:say, prompt:bubbles(vals, hide, false, rule.steps), kind:pad ? "pad" : "choice",
    options:pad ? null : numOpts(ans, 0, 100, [ans + step, ans - step, ans + 1, ans - 1]), answer:ans, answerSay:[n(ans)], rule:rule };
}
function arith(start, step, len){ var v = []; for (var i = 0; i < len; i++) v.push(start + i*step); return v; }
function rCountUpDown(missing){
  var len = ri(4, 5), down = Math.random() < 0.4, vals;
  if (down){ var top = ri(len + 2, 30); vals = arith(top, -1, len); }
  else vals = arith(ri(0, 25), 1, len);
  return seqRound(vals, missing, false);
}
function rSkip(missing){
  var step = pick([2,5,10]), len = 5, start = step*ri(0, Math.floor((100 - step*(len - 1)) / step / 2));
  return seqRound(arith(start, step, len), missing, false);
}
function rRule(missing, pad){
  var step = pick([3,4,6,-2,-3,-5,-10,11]), len = 5, span = Math.abs(step)*(len - 1), start;
  start = step > 0 ? ri(0, 100 - span) : ri(span, 100);

}
function rBuster(pad){
  var type = pick(["double","halve","grow","by25","odd","alt","square"]), v = [], i;
  if (type === "double"){ var s = pick([1,2,3]); v = [s]; while (v.length < 5) v.push(v[v.length - 1]*2); }
  else if (type === "halve"){ v = [pick([64,96,80])]; while (v.length < 5) v.push(v[v.length - 1]/2); }
  else if (type === "grow"){ v = [ri(1, 5)]; for (i = 1; i < 6; i++) v.push(v[i - 1] + i); }
  else if (type === "by25"){ v = arith(pick([0,25]), 25, 4); }
  else if (type === "odd"){ v = arith(2*ri(0, 20) + 1, 2, 5); }
  else if (type === "alt"){ var a = ri(1, 20); v = [a]; for (i = 1; i < 6; i++) v.push(v[i - 1] + (i % 2 ? 2 : -1)); }
  else { var b = ri(1, 3); for (i = b; i < b + 5; i++) v.push(i*i); }
  var ans = v[v.length - 1], say = [], rule, steps = [];
  for (i = 0; i < v.length - 1; i++) say.push(n(v[i]));
  say.push("m_next");
  if (type === "double" || type === "halve"){
    for (i = 1; i < v.length; i++) steps.push(type === "double" ? TIMES_SIGN + "2" : DIV_SIGN + "2");
    rule = { steps:steps, html:steps[0] + " each time", say:["m_rule", type === "double" ? "m_times" : "m_div", n(2)] };
  } else if (type === "grow"){
    for (i = 1; i < v.length; i++) steps.push(signed(v[i] - v[i - 1]));

}

    stage.appendChild(row);
  } else {
    if (R.prompt) stage.appendChild(el("div", "prompt col", R.prompt));
    var ch = el("div", "choices");
    R.options.forEach(function(o){
      var b = el("button", "paper press choice " + o.cls, o.html);
      b.onclick = function(){ if (G.locked) return; if (o.val === R.answer) correct(b); else wrong(b); };
      ch.appendChild(b);
    });
    stage.appendChild(ch);
  }
  setTimeout(function(){ if (G && G.R === R) say(R.say); }, 400);
}

function keypad(){
  var pad = el("div", "pad");
  ["1","2","3","4","5","6","7","8","9","del","0","go"].forEach(function(k){
    var label = k === "del" ? "&#9003;" : k === "go" ? "&#10003;" : k;
    var b = el("button", "paper press key" + (k === "del" ? " del" : k === "go" ? " go" : ""), label);
    b.onclick = function(){ padKey(k, b); };
    pad.appendChild(b);
  });
  return pad;
}
function entry(){ return $("entry"); }
function padKey(k, btn){
  if (G.locked) return;
  if (k === "del"){ G.typed = G.typed.slice(0, -1); }
  else if (k === "go"){
    if (!G.typed) return;
    if (parseInt(G.typed, 10) === G.R.answer){ correct(entry()); return; }
    G.mistakes++;
    var e = entry(); removeClass(e, "nope"); void e.offsetWidth; addClass(e, "nope");
    G.typed = "";
    if (G.mistakes >= 3){ revealAnswer(); return; }
    say(["p_try"]);
  }
  else if (G.typed.length < 3){ G.typed = (G.typed === "0" ? "" : G.typed) + k; }
  setEntry(entry(), G.typed || "?");
}
/* patterns: show the steps between the numbers and the rule line */
function showRule(){
  var R = G.R, seq = document.querySelector("#stage .seq");
  if (!R.rule || !seq) return [];
  addClass(seq, "solved");
  var line = el("div", "rule", "<b>Rule:</b> " + R.rule.html);
  seq.parentNode.insertBefore(line, seq.nextSibling);
  return R.rule.say;
}
/* say it all, then move on once the voice is done (a long timer is only a safety net) */
function sayThenNext(keys){
  var R = G.R, moved = false;
  function moveOn(){ if (moved) return; moved = true; if (G && G.R === R && hasClass($("game"), "on")) nextRound(); }
  say(keys, function(){ setTimeout(moveOn, R.rule ? 1400 : 600); });
  setTimeout(moveOn, 4000 + 1500*keys.length);
}
function revealAnswer(){
  G.locked = true;
  var e = entry(); setEntry(e, String(G.R.answer)); addClass(e, "reveal");
  G.results[G.round] = "ok";
  renderDots();
  var rule = showRule();
  sayThenNext(["m_answer_is"].concat(G.R.answerSay, rule));
}

function correct(target){
  if (G.locked) return;
  G.locked = true;
  var clean = G.mistakes === 0;
  if (clean) G.stars++;
  G.results[G.round] = clean ? "gold" : "ok";
  if (hasClass(target, "choice")) addClass(target, "right");
  var e = entry(); if (e && G.R.kind === "choice"){ if (G.R.answerHtml) e.innerHTML = G.R.answerHtml; else setEntry(e, String(G.R.answer)); }
  renderDots();
  confetti(target);
  var rule = showRule();
  sayThenNext(G.R.answerSay.concat(rule, ["m_praise_" + Math.floor(Math.random()*6)]));
}
function wrong(target){
  G.mistakes++;
  removeClass(target, "nope"); void target.offsetWidth; addClass(target, "nope");
  setTimeout(function(){ addClass(target, "dim"); }, 400);
  say(["p_try"]);
}
function nextRound(){
  G.round++;
  if (G.round >= ROUNDS) showEnd(); else renderRound();
}

function showEnd(){
  var i = G.level, s = G.stars;
  if (best[i] === undefined || s > best[i]){ best[i] = s; save("best", best); }
  $("endTitle").textContent = s === ROUNDS ? "Perfect!" : s >= 7 ? "Out of this world!" : "Level done!";
  $("endScore").innerHTML = "You earned <b>&#9733; " + s + "</b> of " + ROUNDS + " stars.";
  var btns = $("endBtns"); btns.innerHTML = "";
  var again = el("button", "paper press bigbtn", "Play again"); again.onclick = function(){ startLevel(i); }; btns.appendChild(again);
  if (i < GAME.levels.length - 1){
    var nx = el("button", "paper press bigbtn go", "Next: " + GAME.levels[i + 1].name); nx.onclick = function(){ startLevel(i + 1); }; btns.appendChild(nx);
  }
  var all = el("button", "paper press bigbtn", "All levels"); all.onclick = function(){ renderHome(); show("home"); }; btns.appendChild(all);
  show("end");
  G.R = null;
  say([s === ROUNDS ? "p_perfect" : "p_stars_" + s]);
}

function confetti(target){
  if (!target) return;
  var r = target.getBoundingClientRect();
  for (var i = 0; i < 16; i++){
    (function(i){
      var b = el("span", "bit");
      b.style.left = (r.left + r.width/2) + "px";
      b.style.top = (r.top + r.height/2) + "px";
      b.style.background = COLORS[i % COLORS.length];
      document.body.appendChild(b);
      var dx = Math.random()*360 - 180, dy = -(Math.random()*260 + 40), rot = Math.random()*540;
      setTimeout(function(){
        var t = "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)";
        b.style.webkitTransform = t; b.style.transform = t; b.style.opacity = "0";
      }, 20);
      setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 1000);
    })(i);
  }
}

(function(){
  var sky = $("sky");
  for (var i = 0; i < 70; i++){
    var st = el("span", "star"), size = Math.random() < 0.15 ? 0.6 : 0.3;
    st.style.left = (Math.random()*100) + "%"; st.style.top = (Math.random()*100) + "%";
    st.style.width = st.style.height = size + "vmin";
    st.style.webkitAnimationDelay = st.style.animationDelay = (Math.random()*3) + "s";
    sky.appendChild(st);
  }
})();

/* hook for automated tests (harmless on the frame) */
window.MathGame = { game:function(){ return GAME; }, state:function(){ return G; }, start:startLevel, makers:{ rCount:rCount } };

document.addEventListener("touchstart", function(){}, true);
renderHome();
})();
</script>

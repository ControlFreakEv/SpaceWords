<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="parent" content="puzzles.html">
<title>Puzzle games</title>
<style>
@font-face{font-family:"WHFun";src:url("fonts/fredoka.ttf") format("truetype");font-weight:600}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#0B1026;background-image:radial-gradient(circle at 25% 15%, #2A1E5C 0%, #131A3D 45%, #0B1026 80%);color:#F3F6FF;font-family:"WHFun","Trebuchet MS",sans-serif;font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,0);overflow:hidden;
}
button{font-family:inherit;font-weight:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;outline:none}
img{display:block}
svg{display:block;width:100%;height:100%}
.screen{display:none;position:absolute;left:0;top:0;right:0;bottom:0;padding:3vmin 4vmin;overflow:hidden;z-index:1}
.screen.on{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.paper{background:#F7F9FF;color:#1F2A44;border:0.5vmin solid #1F2A44;border-radius:2.8vmin;box-shadow:0.8vmin 0.8vmin 0 #05081A}
.press{-webkit-transition:-webkit-transform .08s,box-shadow .08s;transition:transform .08s,box-shadow .08s}
.press:active{-webkit-transform:translate(0.5vmin,0.5vmin);transform:translate(0.5vmin,0.5vmin);box-shadow:0.3vmin 0.3vmin 0 #05081A}
.flex{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}

/* level list */
.hero{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin:2vmin 0 4vmin}
.hero img{width:12vmin;height:12vmin;-webkit-flex:none;flex:none;margin-right:3vmin;-webkit-animation:hop 1.6s ease-out 1;animation:hop 1.6s ease-out 1}
@-webkit-keyframes hop{0%{-webkit-transform:translateY(5vmin) scale(.6);opacity:0}35%{-webkit-transform:translateY(-5vmin) scale(1.05);opacity:1}55%{-webkit-transform:translateY(0) scaleY(.88)}70%{-webkit-transform:translateY(-1.5vmin)}100%{-webkit-transform:none}}
@keyframes hop{0%{transform:translateY(5vmin) scale(.6);opacity:0}35%{transform:translateY(-5vmin) scale(1.05);opacity:1}55%{transform:translateY(0) scaleY(.88)}70%{transform:translateY(-1.5vmin)}100%{transform:none}}
.hero h1{margin:0;font-size:9vmin;line-height:1;font-weight:600;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.hero p{margin:1vmin 0 0;font-size:3.6vmin;color:#B9C3F2}
.path{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -1.2vmin}
.stone{width:18%;margin:1.2vmin 1%;padding:2.2vmin 2.4vmin;text-align:left;min-height:26vmin;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.num{width:7vmin;height:7vmin;border-radius:50%;border:0.5vmin solid #1F2A44;font-size:3.6vmin;line-height:6vmin;text-align:center;color:#1F2A44}
.sname{font-size:3.4vmin;margin-top:1.4vmin}
.ex{font-size:3vmin;color:#4F5F80;margin-top:.6vmin}
.grade{font-size:2.4vmin;color:#7F8AC0;margin-top:.4vmin}
.best{margin-top:auto;padding-top:1vmin;font-size:2.6vmin;color:#4F5F80}
.best b{color:#1F2A44}
.foot{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;margin-top:auto;padding-top:2vmin}
.foot > *{margin:0 2vmin 1.4vmin 0}
.note{font-size:2.4vmin;color:#B9C3F2}
.credit{font-size:1.8vmin;color:#7F8AC0;width:100%}

/* game */
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:1.4vmin}
.dots{-webkit-flex:1;flex:1;text-align:center;font-size:0}
.dot{display:inline-block;width:3.2vmin;height:3.2vmin;border-radius:50%;border:0.45vmin solid #5CE1E6;background:#131A3D;margin:0 .6vmin}
.dot.now{background:#5CE1E6}.dot.gold{background:#FFD93D;border-color:#FFD93D}.dot.ok{background:#7CFFB2;border-color:#7CFFB2}
.stars{font-size:4vmin;min-width:13vmin;text-align:right;color:#FFD93D}
.stage{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;min-height:0}
/* room on the right for the turn timer's countdown (under the stars) */
.hintrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;max-width:100%;padding:0 17vmin;margin-bottom:1vmin}
.hint{margin:0;font-size:4vmin;color:#B9C3F2;text-align:center}
.sayb{width:8vmin;height:8vmin;border-radius:50%;background:#FFD93D;margin-left:2vmin;-webkit-flex:none;flex:none}
.sayb img{width:5vmin;height:5vmin}
.pzrow{-webkit-flex:1;flex:1;width:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-around;justify-content:space-around;min-height:0}
.side{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;width:62vmin}

/* the puzzle: a grid of boxes, one of them empty */
.mx{padding:1.2vmin;border-radius:3vmin;background:#131A3D;border:0.5vmin solid #5CE1E6}
.mrow{display:-webkit-flex;display:flex}
.pc{margin:.8vmin;padding:.6vmin;position:relative;overflow:hidden;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  border-radius:2vmin;box-shadow:none;border-width:0.4vmin}
.pc.q{border:0.4vmin dashed #1F2A44;background:#FFD93D;font-size:9vmin;color:#1F2A44}
.pc.q.got{background:#7CFFB2}
.pc.q.shown{background:#FF9E5C}
.pc .pic,.pzopt .pic{width:70%;height:70%}
.cnt{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;-webkit-align-content:center;align-content:center;width:100%;height:100%}
.nv{line-height:1;color:#1F2A44}
.board{width:60vmin;height:60vmin;border-radius:2.4vmin;overflow:hidden;border:0.5vmin solid #1F2A44;background:#F7F9FF;box-shadow:0.8vmin 0.8vmin 0 #05081A}

/* answer choices: 5, like the real test */
.opts{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.pzopt{width:17vmin;height:17vmin;margin:1.2vmin;padding:.8vmin;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;overflow:hidden}
.pzopt.dim{opacity:.35;pointer-events:none}
.pzopt.right{background:#7CFFB2}
.pzopt.shown{background:#FF9E5C}
.why{margin-top:1.4vmin;min-height:9vmin;width:100%;padding:1.2vmin 2.4vmin;border-radius:2.4vmin;background:#131A3D;border:0.5vmin solid #7CFFB2;font-size:3.4vmin;line-height:1.25;color:#F3F6FF;text-align:center;visibility:hidden}
.why.on{visibility:visible}
.why b{color:#7CFFB2;font-weight:600}
.nope{-webkit-animation:shake .4s;animation:shake .4s}
@-webkit-keyframes shake{20%{-webkit-transform:translateX(-1.4vmin)}40%{-webkit-transform:translateX(1.4vmin)}60%{-webkit-transform:translateX(-.8vmin)}80%{-webkit-transform:translateX(.8vmin)}}
@keyframes shake{20%{transform:translateX(-1.4vmin)}40%{transform:translateX(1.4vmin)}60%{transform:translateX(-.8vmin)}80%{transform:translateX(.8vmin)}}

/* end */
.endbox{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center}
.endbox img{width:18vmin;height:18vmin}
.endbox h2{margin:2vmin 0 1vmin;font-size:10vmin;font-weight:600;line-height:1;color:#FFD93D;text-shadow:0.6vmin 0.6vmin 0 #05081A}
.score{font-size:4.4vmin;color:#B9C3F2}
.score b{color:#FFD93D}
.endbtns{margin-top:4vmin;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.bigbtn{padding:2.4vmin 4vmin;font-size:3.8vmin;border-radius:2.6vmin;margin:1vmin 1.4vmin}
.bigbtn.go{background:#7CFFB2;color:#14193A}

.bit{position:fixed;width:1.8vmin;height:1.8vmin;border-radius:.4vmin;pointer-events:none;z-index:9;
  -webkit-transition:-webkit-transform .9s ease-out,opacity .9s ease-out;transition:transform .9s ease-out,opacity .9s ease-out}
#sky{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;-webkit-animation:twinkle 3s ease-in-out infinite;animation:twinkle 3s ease-in-out infinite}
@-webkit-keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@media (orientation: portrait){
  .stone{width:48%}
  .hero h1{font-size:10vmin}
  .pzrow{-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-around;justify-content:space-around}
  .side{width:92vmin}
  .why{max-width:80vmin}
}
</style>
<link rel="stylesheet" href="back.css">
</head>
<body>
<div id="sky"></div>
<button class="backbtn" id="backBtn" aria-label="Back"><b>&#8592;</b>Back</button>

<section class="screen on" id="home">
  <div class="hero backroom">
    <img id="heroImg" src="emoji/1f9e9.svg" alt="">
    <div><h1 id="heroTitle"></h1><p id="heroSub"></p></div>
  </div>
  <div class="path" id="path"></div>
  <div class="foot">
    <span class="note" id="speechNote" style="display:none">Talking isn't set up on this device yet. Questions are still written on screen.</span>
    <span class="credit">Pictures: Twemoji by Twitter and contributors, CC-BY 4.0</span>
  </div>
</section>

<section class="screen" id="game">
  <div class="bar">
    <span class="barspace"></span>
    <div class="dots" id="dots"></div>
    <div class="stars" id="stars"></div>
  </div>
  <div class="stage" id="stage"></div>
</section>

<section class="screen" id="end">
  <div class="endbox">
    <img src="emoji/1f9e0.svg" alt="">
    <h2 id="endTitle"></h2>
    <div class="score" id="endScore"></div>
    <div class="endbtns" id="endBtns"></div>
  </div>
</section>

<script src="speech.js"></script>
<script>
/* Puzzle games: thinking puzzles in the style of the NGAT (Naglieri General Ability Tests), which
   gifted programs use: a box of pictures with one empty, five answers to pick from, no reading needed.
   ?g=shape  (Nonverbal: shapes, colors, turns, lines)
   ?g=picture (Verbal: what goes together, picture pairs)
   ?g=number (Quantitative: how many, number rules, sides and parts)
   Plain ES5 for the frame's Chromium 39. */
(function(){
"use strict";

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function ri(lo, hi){ return lo + Math.floor(Math.random()*(hi - lo + 1)); }
function hasClass(e, c){ return (" " + e.className + " ").indexOf(" " + c + " ") >= 0; }
function addClass(e, c){ if (!hasClass(e, c)) e.className += " " + c; }
function removeClass(e, c){ e.className = (" " + e.className + " ").replace(" " + c + " ", " ").replace(/^\s+|\s+$/g, ""); }
function show(id){ ["home","game","end"].forEach(function(s){ $(s).className = "screen" + (s === id ? " on" : ""); }); document.body.setAttribute("data-screen", id); }
function clone(o){ var c = {}, k; for (k in o) if (o.hasOwnProperty(k)) c[k] = o[k]; return c; }
function mod(x, k){ return ((x % k) + k) % k; }
function f1(v){ return String(Math.round(v*10)/10); }
function n(k){ return "n_" + k; }
function img(code, cls){ return '<img' + (cls ? ' class="' + cls + '"' : '') + ' src="emoji/' + code + '.svg" alt="">'; }
function other(list, v){ var o = list.filter(function(x){ return x !== v; }); return pick(o); }
function bits(m){ var c = 0; while (m){ c += m & 1; m >>= 1; } return c; }

/* five answer choices: the right one plus 4 different wrong ones (first ones in the list come first).
   key() says when two look the same; a wrong one that looks like the answer is never used. */
function choices(ans, wrongs, render, key){
  var seen = {}, out = [{ html:render(ans), key:key(ans), v:ans }];
  seen[out[0].key] = 1;
  for (var i = 0; i < wrongs.length && out.length < 5; i++){
    var w = wrongs[i]; if (w === null || w === undefined) continue;
    var k = key(w); if (seen[k]) continue;
    seen[k] = 1; out.push({ html:render(w), key:k, v:w });
  }
  return out;
}

/* ====================================================================
   SHAPES (nonverbal)
   A shape spec: s shape, c color (0-5), f inside (0 solid, 1 outline, 2 ring), z size (0 small, 1 middle,
   2 big), r turn in degrees (only arrow, pac and ell turn), n how many (1-5).
   ==================================================================== */
var COL = ["#E5484D","#FF8A3D","#F2B400","#2FA86E","#3B82F6","#9B5DE5"];
var SH = ["circle","square","triangle","diamond","star","hexagon"];
var TURNERS = ["arrow","pac","ell"];
var SIZES = [0.52, 0.76, 1];
var POS = { 1:[[50,50]], 2:[[28,50],[72,50]], 3:[[50,28],[27,72],[73,72]], 4:[[28,28],[72,28],[28,72],[72,72]], 5:[[25,25],[75,25],[50,50],[25,75],[75,75]] };
function pts(a){ return a.map(function(p){ return f1(p[0]) + "," + f1(p[1]); }).join(" "); }
function ngon(k, R){ var a = []; for (var i = 0; i < k; i++){ var t = 2*Math.PI*i/k; a.push([R*Math.sin(t), -R*Math.cos(t)]); } return a; }
function scaleP(a, R){ return a.map(function(p){ return [p[0]*R, p[1]*R]; }); }
/* a shape around (0,0), about 2R wide */
function shapeEl(s, R, at){
  var P, i;
  if (s === "circle") return '<circle cx="0" cy="0" r="' + f1(R*0.92) + '"' + at + '/>';
  if (s === "square") return '<rect x="' + f1(-R*0.8) + '" y="' + f1(-R*0.8) + '" width="' + f1(R*1.6) + '" height="' + f1(R*1.6) + '"' + at + '/>';
  if (s === "pac"){
    var a = 35*Math.PI/180, x = R*Math.sin(a), y = -R*Math.cos(a);
    return '<path d="M0,' + f1(R*0.15) + ' L' + f1(x) + ',' + f1(y) + ' A' + f1(R) + ',' + f1(R) + ' 0 1,1 ' + f1(-x) + ',' + f1(y) + ' Z"' + at + '/>';
  }
  if (s === "triangle") P = ngon(3, R*1.08).map(function(p){ return [p[0], p[1] + R*0.2]; });
  else if (s === "diamond") P = [[0,-R],[R*0.72,0],[0,R],[-R*0.72,0]];
  else if (s === "hexagon") P = ngon(6, R*0.95);
  else if (s === "star"){ P = []; for (i = 0; i < 10; i++){ var rr = i % 2 ? R*0.45 : R*1.05, t = i*Math.PI/5; P.push([rr*Math.sin(t), -rr*Math.cos(t) + R*0.08]); } }
  else if (s === "arrow") P = scaleP([[0,-1],[0.8,-0.12],[0.3,-0.12],[0.3,0.95],[-0.3,0.95],[-0.3,-0.12],[-0.8,-0.12]], R);
  else if (s === "ell") P = scaleP([[-0.7,-0.95],[-0.18,-0.95],[-0.18,0.42],[0.72,0.42],[0.72,0.92],[-0.7,0.92]], R);
  else P = ngon(parseInt(s.slice(1), 10), R);   // "p5" = a 5-sided shape
  return '<polygon points="' + pts(P) + '"' + at + '/>';
}
function paint(s, col, f, R){
  R = R || 38;
  if (f === 1) return shapeEl(s, R, ' fill="#FFFFFF" stroke="' + col + '" stroke-width="' + f1(R/4.6) + '" stroke-linejoin="round"');
  if (f === 2) return shapeEl(s, R, ' fill="#FFFFFF" stroke="' + col + '" stroke-width="' + f1(R/5.4) + '" stroke-linejoin="round"') + shapeEl(s, R*0.42, ' fill="' + col + '"');
  return shapeEl(s, R, ' fill="' + col + '" stroke="#1F2A44" stroke-width="' + f1(R/12) + '" stroke-linejoin="round"');
}
function norm(r){ return mod(r || 0, 360); }
function specKey(sp){ return [sp.s, sp.c, sp.f, sp.z, norm(sp.r), sp.n].join("|"); }
function specSvg(sp){
  var pos = POS[sp.n], k = (sp.n > 1 ? (sp.n > 3 ? 0.42 : 0.5) : 1)*SIZES[sp.z], out = '<svg viewBox="0 0 100 100">';
  pos.forEach(function(p){ out += '<g transform="translate(' + p[0] + ' ' + p[1] + ') rotate(' + norm(sp.r) + ') scale(' + f1(k*100)/100 + ')">' + paint(sp.s, COL[sp.c], sp.f) + '</g>'; });
  return out + '</svg>';
}
function randSpec(turner){ return { s:pick(turner ? TURNERS : SH), c:ri(0, 5), f:0, z:2, r:turner ? 90*ri(0, 3) : 0, n:1 }; }
/* values each part can take (the first two are the usual ones, a third for wrong answers) */
function values(p){
  if (p === "s") return shuffle(SH);
  if (p === "c") return shuffle([0,1,2,3,4,5]);
  if (p === "f") return shuffle([0,1,2]);
  if (p === "z") return shuffle([0,2]).concat([1]);
  return [];
}
var PART_NAME = { s:"shape", c:"color", f:"inside", z:"size" };
function shapeRound(R){ R.render = specSvg; R.key = specKey; return R; }

/* 2 x 2: each row keeps one thing the same, each column another */
function rMatch(pool){
  var ab = shuffle(pool).slice(0, 2), A = ab[0], B = ab[1], base = randSpec(false);
  if (Math.random() < 0.3 && A !== "f" && B !== "f") base.f = pick([1, 2]);
  var av = values(A), bv = values(B);
  function mk(a, b){ var s = clone(base); s[A] = a; s[B] = b; return s; }
  var ans = mk(av[1], bv[1]), rest = ["s","c","f"].filter(function(p){ return p !== A && p !== B; });
  var odd = clone(ans), q = pick(rest); odd[q] = other(values(q), ans[q]);
  return shapeRound({ kind:"grid", hint:"Which one goes in the empty box?", say:["pz_i_box"], rows:2, cols:2,
    cells:[mk(av[0], bv[0]), mk(av[0], bv[1]), mk(av[1], bv[0]), ans], hole:3,
    options:choices(ans, shuffle([mk(av[1], bv[0]), mk(av[0], bv[1]), mk(av[1], bv[2]), mk(av[2], bv[1])]).concat([odd, mk(av[0], bv[0])]), specSvg, specKey),
    why:{ text:"Across, the " + PART_NAME[A] + " stays the same. Down, the " + PART_NAME[B] + " stays the same.", say:["pz_row_" + A, "pz_col_" + B] },
    test:{ type:"match", A:A, B:B } });
}

/* 2 x 2 "changes": the top shape turns into the next one; the bottom one changes the same way.
   changes: any of "c" color, "s" shape, "z" size, "f" inside, "r" turn, "n" one more */
function rChange(changes){
  var turn = changes.indexOf("r") >= 0, A = randSpec(turn), i;
  if (changes.indexOf("n") >= 0) A.n = ri(1, 3);
  if (changes.indexOf("z") >= 0) A.z = pick([0, 2]);
  if (Math.random() < 0.35 && changes.indexOf("f") < 0) A.f = pick([1, 2]);
  var B = clone(A), turnBy = pick([90, 90, 180]);
  changes.forEach(function(p){
    if (p === "r") B.r = A.r + turnBy;
    else if (p === "n") B.n = A.n + 1;
    else if (p === "z") B.z = 2 - A.z;
    else if (p === "s") B.s = other(SH, A.s);
    else B[p] = other(values(p), A[p]);
  });
  /* the bottom one starts out different (not in what changes) */
  var C = clone(A), free = ["s","c","f"].filter(function(p){ return changes.indexOf(p) < 0; }), q = pick(free);
  if (q === "s") C.s = other(turn ? TURNERS : SH, A.s); else C[q] = other(values(q), A[q]);
  if (turn) C.r = A.r + 90*ri(1, 3);
  var D = clone(C);
  changes.forEach(function(p){ D[p] = p === "r" ? C.r + turnBy : B[p]; });
  /* wrong answers: no change, only some of the changes, the wrong change, one change too many */
  var wrong = [C];
  changes.forEach(function(p){
    var half = clone(D); half[p] = C[p]; wrong.push(half);
    var w = clone(D);
    if (p === "r") w.r = C.r + (turnBy === 90 ? 270 : 90);
    else if (p === "n") w.n = C.n + 2;
    else if (p === "z") w.z = 1;
    else w[p] = other(values(p).filter(function(v){ return v !== C[p]; }), D[p]);
    wrong.push(w);
  });
  var extra = clone(D), q2 = pick(free); if (q2 === "s") extra.s = other(turn ? TURNERS : SH, D.s); else extra[q2] = other(values(q2), D[q2]);
  wrong = shuffle(wrong.slice(1)).concat([extra, B, A]);
  wrong.unshift(C);
  var sayWhy = changes.map(function(p){
    if (p === "r") return turnBy === 90 ? "pz_chg_turn90" : "pz_chg_turn180";
    if (p === "z") return B.z > A.z ? "pz_chg_big" : "pz_chg_small";
    if (p === "n") return "pz_chg_more";
    return "pz_chg_" + (p === "s" ? "shape" : p === "c" ? "color" : "fill");
  });

    { name:"Number pairs", ex:"4 → 8, 5 → ?", grade:"1st grade", rounds:x(function(){ return rRule([["+",ri(3,10)],["-",ri(3,9)],["x",2],["/",2],["+",10]], { min:2, max:20, rows:3, top:60 }); }, 6).concat(x(function(){ return rRule([["x",2],["+",3],["-",2]], { pics:true, max:7, rows:3, top:10 }); }, 2), x(function(){ return rSides(false); }, 2)) },
    { name:"Number grids", ex:"Across and down", grade:"2nd grade", rounds:x(function(){ return rGrid(["step","sum","diff","geo2"]); }, 8).concat(x(function(){ return rParts(false); }, 2)) },
    { name:"Shape math", ex:"Sides, parts, dots", grade:"3rd grade and up", rounds:x(function(){ return rGrid(["step","sum","diff","geo2","geo3","prod"]); }, 4).concat(x(rDots, 2), x(function(){ return rParts(true); }, 2), x(function(){ return rSides(true); }, 2)) }
  ]}
};
var COLORS = ["#FFC93C","#FF8A3D","#E5487A","#3FB37F","#4BA3D9"];

var gameId = (location.search.match(/[?&]g=([a-z]+)/) || [])[1];
if (!GAMES[gameId]) gameId = "shape";
var GAME = GAMES[gameId];
var ROUNDS = 10;
document.title = GAME.title;

/* ---------- storage and speech ---------- */
function load(k, d){ try { var v = localStorage.getItem("puzzle:" + gameId + ":" + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem("puzzle:" + gameId + ":" + k, JSON.stringify(v)); } catch(e){} }
var best = load("best", {});
function say(keys, done){ Speech.say(keys, done); }
Speech.onChange(function(){ if (hasClass($("home"), "on")) renderHome(); });

/* ---------- level list ---------- */
function renderHome(){
  $("heroImg").src = "emoji/" + GAME.icon + ".svg";
  $("heroTitle").textContent = GAME.title;
  $("heroSub").textContent = GAME.sub;
  var path = $("path"); path.innerHTML = "";
  GAME.levels.forEach(function(lv, i){
    var b = el("button", "paper press stone"), got = best[i];
    b.innerHTML = '<span class="num" style="background:' + COLORS[i] + '">' + (i + 1) + '</span>' +
      '<span class="sname">' + lv.name + '</span><span class="ex">' + lv.ex + '</span><span class="grade">' + lv.grade + '</span>' +
      '<span class="best">' + (got === undefined ? "Not played yet" : 'Best: <b>&#9733; ' + got + '</b> of ' + ROUNDS) + '</span>';
    b.onclick = function(){ startLevel(i); };
    path.appendChild(b);
  });
  $("speechNote").style.display = Speech.mode() === "none" ? "" : "none";
}
/* Back: from a game or the end screen to the level list; from the level list to the picker */
function goBack(){ Speech.stop(); if (hasClass($("home"), "on")) location.href = "puzzles.html"; else { renderHome(); show("home"); } }
$("backBtn").onclick = goBack;
window.goBack = goBack;

/* ---------- playing ---------- */
var G = null;
function startLevel(i, maker){
  G = { level:i, makers:maker ? x(maker, ROUNDS) : shuffle(GAME.levels[i].rounds).slice(0, ROUNDS), round:0, stars:0, results:[] };
  show("game");
  renderRound();
}
function renderDots(){
  var d = $("dots"); d.innerHTML = "";
  for (var i = 0; i < ROUNDS; i++){
    var r = G.results[i];
    d.appendChild(el("span", "dot" + (r === "gold" ? " gold" : r === "ok" ? " ok" : i === G.round ? " now" : "")));
  }
  $("stars").innerHTML = "&#9733; " + G.stars;
}
/* what's in a box of the puzzle; pictures say their name when tapped */
function cellHtml(R, v){
  if (R.cellRender) return R.cellRender(v);
  if (R.tapPics) return '<img class="pic tw" data-say="w_' + v + '" src="emoji/' + PIC[v] + '.svg" alt="">';
  return R.render(v);
}
function numSay(v){ return v.t === "num" && v.v <= 100 ? "n_" + v.v : ""; }
function renderRound(){
  var R = G.makers[G.round]();
  G.R = R; G.mistakes = 0; G.locked = false;
  renderDots();
  var stage = $("stage"); stage.innerHTML = "";
  var hr = el("div", "hintrow");
  hr.appendChild(el("p", "hint", Speech.tapText(R.hint)));
  if (Speech.canTalk()){
    var sb = el("button", "paper press sayb flex", img("1f50a"));
    sb.onclick = function(){ say(R.say); };
    hr.appendChild(sb);
  }
  stage.appendChild(hr);
  var row = el("div", "pzrow"), mx;
  if (R.kind === "board"){ mx = el("div", "board", R.board(null)); }
  else {
    var sz = CELL[Math.max(R.rows, R.cols)];
    mx = el("div", "mx");
    for (var r = 0; r < R.rows; r++){
      var mr = el("div", "mrow");
      for (var c = 0; c < R.cols; c++){
        var i = r*R.cols + c, cell = el("div", "pc" + (i === R.hole ? " q" : " paper"));
        cell.style.width = cell.style.height = sz + "vmin";
        if (i === R.hole){ cell.id = "hole"; cell.innerHTML = "?"; }
        else {
          cell.innerHTML = cellHtml(R, R.cells[i]);
          var ns = numSay(R.cells[i]); if (ns) cell.innerHTML = '<span class="tw" data-say="' + ns + '">' + cell.innerHTML + '</span>';
        }
        mr.appendChild(cell);
      }
      mx.appendChild(mr);
    }
  }
  row.appendChild(mx);
  var side = el("div", "side"), opts = el("div", "opts");
  R.ansKey = R.options[0].key;   // choices() puts the right one first
  R.options = shuffle(R.options);
  R.options.forEach(function(o, k){
    if (o.key === R.ansKey) R.answer = k;
    var b = el("button", "paper press pzopt", o.html);
    b.onclick = function(){ if (G.locked) return; if (o.key === R.ansKey) correct(b); else wrong(b); };
    opts.appendChild(b);
  });
  side.appendChild(opts);
  side.appendChild(el("div", "why", ""));
  row.appendChild(side);
  stage.appendChild(row);
  setTimeout(function(){ if (G && G.R === R) say(R.say); }, 400);
}
/* the answer goes into the empty box */
function fillHole(how){
  var R = G.R, ans = R.options[R.answer];
  if (R.kind === "board"){ document.querySelector("#stage .board").innerHTML = R.board(ans.v); return; }
  var h = $("hole"); if (!h) return;
  h.innerHTML = cellHtml(R, ans.v); addClass(h, how);
}
function showWhy(){
  var w = document.querySelector("#stage .why"); if (!w) return [];
  w.innerHTML = G.R.why.text.indexOf("<") >= 0 ? G.R.why.text : Speech.tapText(G.R.why.text);
  addClass(w, "on");
  return G.R.why.say;
}
function sayThenNext(keys){
  var R = G.R, moved = false;
  function moveOn(){ if (moved) return; moved = true; if (G && G.R === R && hasClass($("game"), "on")) nextRound(); }
  say(keys, function(){ setTimeout(moveOn, 1600); });
  setTimeout(moveOn, 5000 + 1800*keys.length);
}
function correct(btn){
  if (G.locked) return;
  G.locked = true;
  var clean = G.mistakes === 0;
  if (clean) G.stars++;
  G.results[G.round] = clean ? "gold" : "ok";
  addClass(btn, "right");
  dimOthers(btn);
  fillHole("got");
  renderDots();
  confetti(btn);
  sayThenNext(["pz_praise_" + Math.floor(Math.random()*5)].concat(showWhy()));
}
function dimOthers(keep){ Array.prototype.forEach.call(document.querySelectorAll("#stage .pzopt"), function(b){ if (b !== keep) addClass(b, "dim"); }); }
/* two wrong taps show the answer */
function wrong(btn){
  G.mistakes++;
  removeClass(btn, "nope"); void btn.offsetWidth; addClass(btn, "nope");
  setTimeout(function(){ addClass(btn, "dim"); }, 400);
  if (G.mistakes < 2){ say(["p_try"]); return; }
  G.locked = true;
  var b = document.querySelectorAll("#stage .pzopt")[G.R.answer];
  addClass(b, "shown"); dimOthers(b);
  fillHole("shown");
  G.results[G.round] = "ok";
  renderDots();
  sayThenNext(["pz_answer"].concat(showWhy()));
}
function nextRound(){
  G.round++;
  if (G.round >= ROUNDS) showEnd(); else renderRound();
}
function showEnd(){
  var i = G.level, s = G.stars;
  if (best[i] === undefined || s > best[i]){ best[i] = s; save("best", best); }
  $("endTitle").textContent = s === ROUNDS ? "Perfect!" : s >= 7 ? "Super thinking!" : "Level done!";
  $("endScore").innerHTML = "You earned <b>&#9733; " + s + "</b> of " + ROUNDS + " stars.";
  var btns = $("endBtns"); btns.innerHTML = "";
  var again = el("button", "paper press bigbtn", "Play again"); again.onclick = function(){ startLevel(i); }; btns.appendChild(again);
  if (i < GAME.levels.length - 1){
    var nx = el("button", "paper press bigbtn go", "Next: " + GAME.levels[i + 1].name); nx.onclick = function(){ startLevel(i + 1); }; btns.appendChild(nx);
  }
  var all = el("button", "paper press bigbtn", "All levels"); all.onclick = function(){ renderHome(); show("home"); }; btns.appendChild(all);
  show("end");
  G.R = null;
  say([s === ROUNDS ? "pz_perfect" : "p_stars_" + s]);
}
function confetti(target){
  if (!target) return;
  var r = target.getBoundingClientRect();
  for (var i = 0; i < 16; i++){
    (function(i){
      var b = el("span", "bit");
      b.style.left = (r.left + r.width/2) + "px";
      b.style.top = (r.top + r.height/2) + "px";
      b.style.background = COLORS[i % COLORS.length];
      document.body.appendChild(b);
      var dx = Math.random()*360 - 180, dy = -(Math.random()*260 + 40), rot = Math.random()*540;
      setTimeout(function(){
        var t = "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)";
        b.style.webkitTransform = t; b.style.transform = t; b.style.opacity = "0";
      }, 20);
      setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 1000);
    })(i);
  }
}
(function(){
  var sky = $("sky");
  for (var i = 0; i < 70; i++){
    var st = el("span", "star"), size = Math.random() < 0.15 ? 0.6 : 0.3;
    st.style.left = (Math.random()*100) + "%"; st.style.top = (Math.random()*100) + "%";
    st.style.width = st.style.height = size + "vmin";
    st.style.webkitAnimationDelay = st.style.animationDelay = (Math.random()*3) + "s";
    sky.appendChild(st);
  }
})();

/* hook for automated tests (harmless on the frame) */
window.PuzzleGame = { game:function(){ return GAME; }, state:function(){ return G; }, start:startLevel, PIC:PIC, CATS:CATS, FAMS:FAMS, FAMILY:FAMILY, RULES:RULES, applyRule:applyRule };

document.addEventListener("touchstart", function(){}, true);
renderHome();
})();
</script>
</body>

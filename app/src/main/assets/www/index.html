<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Space Words</title>
<link rel="stylesheet" href="hub.css">
<link rel="stylesheet" href="back.css">
<style>.games{margin-bottom:3.4vmin}</style>
</head>
<body>
<button class="backbtn" id="backBtn" aria-label="Back"><b>&#8592;</b>Back</button>
<div class="top backroom"><h1>Pick a mission</h1></div>
<div class="games">
  <button class="game c1" data-go="words.html" data-stars="wordhop:best saucer:best match:connect:best match:rhyme:best sound:best compound:best classwords:best">
    <img src="emoji/1f4da.svg" alt="">
    <span class="t">Word games</span>
    <span class="d">Read, listen, and spell</span>
    <span class="got"></span>
  </button>
  <button class="game c2 alt" data-go="math.html" data-stars="math:count:best math:ops:best math:pattern:best">
    <span class="art"><img src="emoji/1fa90.svg" alt=""><span class="nums"><b class="k1">1</b><b class="op">+</b><b class="k2">2</b><b class="op">=</b><b class="k3">3</b></span></span>
    <span class="t">Math games</span>
    <span class="d">Count, add, and crack the code</span>
    <span class="got"></span>
  </button>
</div>
<!-- turn timer: 5 minutes each, then "Switch turns!" (filled in by speech.js) -->
<div class="turnbar" id="turnbar"></div>
<script src="speech.js"></script>
<script src="hub.js"></script>
</body>
</html>
